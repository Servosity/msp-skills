# NOTE: the "Which skill" dropdown options are GENERATED from tools/skills.json
# by tools/maintainer/build-catalog.py (every connector, slug-sorted, plus
# "other / not listed"). Do NOT edit the options by hand - register the skill
# and run `python3 tools/maintainer/build-catalog.py`; CI (catalog.yml) fails
# on drift. Listing every connector means a reporter can pick the exact skill
# instead of being forced into "other", so the live-verified.yml automation can
# badge the correct slug directly. (See live-verified.yml's parse step, which
# also cross-checks the title/body and bails to a human on any disagreement.)
name: "✅ Report: it works"
description: Tell us a Skill or MCP server ran against your real tenant. We badge it "live-verified" and thank you.
title: "[Works] "
labels: ["live-verified-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for closing the loop. When a real MSP runs a Skill against a real tenant and it works, that is the signal we badge as "live-verified". Tell us what you ran and a maintainer (or our automation) will flip the badge.

  - type: dropdown
    id: skill
    attributes:
      label: Which skill
      description: The Skill / MCP server you ran.
      options:
        - abnormal
        - acronis
        - action1
        - afi
        - appdirect
        - atera
        - autotask
        - aws-billing
        - axcient
        - betterstack
        - blumira
        - cipp
        - connectwise-automate
        - connectwise-control
        - connectwise-manage
        - cork
        - cove
        - crowdstrike
        - datto-bcdr
        - datto-rmm
        - domotz
        - gradient
        - halopsa
        - hubspot
        - hudu
        - huntress
        - itglue
        - kaseya-bms
        - knowbe4
        - levelio
        - liongard
        - maxio
        - microsoft-graph
        - mspbots
        - n-central
        - nerdio
        - ninjaone
        - pagerduty
        - pandadoc
        - pax8
        - pipedrive
        - proofpoint
        - quickbooks
        - resourceguru
        - rewst
        - rocketcyber
        - rootly
        - runzero
        - salesbuildr
        - sentinelone
        - servosity
        - sherweb
        - skykick
        - superops
        - syncro
        - tactical-rmm
        - threatlocker
        - unifi-network
        - veeam
        - wordpress
        - xero
        - zammad
        - other / not listed
    validations:
      required: true

  - type: dropdown
    id: agent
    attributes:
      label: Which AI agent did you use?
      description: The AI client you ran it from.
      options:
        - Claude Desktop
        - Claude Code
        - ChatGPT
        - Codex
        - Copilot
        - Gemini
        - Other
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What did you ask / run?
      description: The question you asked, or the command you ran.
      placeholder: |
        e.g. "Which clients have HaloPSA tickets breaching SLA in the next 4 hours?"
        or  servosity devices stale --days 3
    validations:
      required: true

  - type: textarea
    id: surprised
    attributes:
      label: Anything that surprised you?
      description: Optional. Anything unexpected, delightful, or rough.
      placeholder: |
        e.g. "It found a stale backup we'd missed for two weeks."
    validations:
      required: false

  - type: checkboxes
    id: real_tenant
    attributes:
      label: Confirmation
      description: We only badge skills run against real data.
      options:
        - label: I ran this against a real tenant (not a demo / sandbox).
          required: true
