name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly FULL-matrix sweep. Pushes to main build only the skills the push
  # changed (see `prepare`), so this is the bound on anything scoping could
  # miss: a toolchain or module-cache drift, a base SHA the runner could not
  # resolve, a registry edit that touched nothing under skills/. Sunday 06:00
  # UTC is the quietest hour for the org's runner pool.
  schedule:
    - cron: "0 6 * * 0"
  # The same sweep on demand (after a mis-scoped push, or to re-prove the fleet
  # before a release wave). No inputs: dispatch = full matrix.
  workflow_dispatch:

permissions:
  contents: read

# PR runs supersede each other: a new push to the same PR cancels the run for
# the commit it just replaced (nobody is waiting on that verdict). Every other
# run is keyed by its own run id, so main pushes are NEVER cancelled or
# coalesced: `prepare` diffs each push against its own github.event.before, so
# a run dropped in favour of a newer one would leave its change-set built by
# nobody - the newer run's `before` starts where the dropped push ended. Not
# keyed by SHA either: two force-pushes landing on the same commit have
# different `before`s and different matrices, and GitHub replaces a PENDING
# run in a group even with cancel-in-progress off.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the DCO range check works on PRs

      - name: Repo hygiene guards (placeholder, em-dash, personal paths)
        # Decides on each guard's OUTPUT, so a tracked file missing from disk
        # can no longer turn a printed violation into "All CI guards passed"
        # (the xargs/grep exit-status false GREEN). The self-test proves it.
        run: |
          set -euo pipefail
          bash tools/maintainer/ci_guards.sh --self-test
          bash tools/maintainer/ci_guards.sh

      - name: New hand-fixes recorded in their ledger (PR diff)
        if: github.event_name == 'pull_request'
        # If this PR edits a generated (DO NOT EDIT) file in a connector without
        # also recording it in skills/<slug>/handfixes.json, fail - so a new
        # hand-fix is captured the moment it is introduced and survives the next
        # reprint. Reprints (many generated files at once) are exempted; the
        # per-skill ledger gate covers recorded fixes there.
        #
        # Also the issue #252 ratchet, scoped per ASSERT: an assert this PR ADDS
        # or WEAKENS must not be one comments alone can satisfy. An assert that
        # was already comment-satisfiable at the base revision is the repo's
        # backlog, not this contributor's, and is reported by the advisory lint
        # below instead - editing an entry's prose never trips this gate.
        # See docs/reprint-survival.md.
        run: python3 tools/maintainer/check_handfixes.py --changed --base "${{ github.event.pull_request.base.sha }}"

      - name: Comment-satisfiable hand-fix asserts (advisory, repo-wide)
        # ADVISORY: exits 0 on findings, by design. 26 of the 2280 `contains`
        # asserts can be satisfied by a comment alone today, several of them
        # deliberately (a `Hand-wired:` marker IS a comment). Making that a
        # merge gate would red main for everyone and get the lint ignored - the
        # false-RED failure mode. The hard ratchet is the --changed step above,
        # so the number can only go down; this step is what makes the standing
        # backlog visible on every run instead of only when somebody remembers
        # to type the flag. Add --strict to make it fail once the list is empty.
        run: python3 tools/maintainer/check_handfixes.py --lint-asserts

      - name: Maintainer gate self-tests (each gate proved BOTH directions)
        # One step, four proofs. A gate that cannot fail is worthless and a gate
        # that always fires is worse, so each of these asserts its check is
        # silent on the repo's real inputs AND fires on the defect it was
        # written for:
        #   registry.py       - every registered slug and source_dir loads clean
        #                       (including skills/_meta, which the SLUG rule
        #                       rejects on purpose), and eleven malformed
        #                       identifiers are refused before they reach the
        #                       build matrix's unquoted shell interpolations.
        #                       The trailing-newline cases carry their own proof
        #                       that they discriminate: the `$`-anchored twin of
        #                       each pattern must ACCEPT what `\Z` refuses.
        #   check_handfixes.py- issue #252's reproduction: the same assert is
        #                       silent while the guarded code is present and
        #                       fires once only a comment carries the needle;
        #                       `code_only` is refused where it would WEAKEN an
        #                       assert; and the --changed ratchet passes a
        #                       prose-only ledger edit while failing a newly
        #                       added or newly weakened assert (four cases, run
        #                       against a throwaway git repository).
        #   mcpb_bundle.py    - the published .mcpb defect (issue #287), a broken
        #                       per-OS override, a 0644 binary and a ZIP_STORED
        #                       member all fail; a built bundle and the
        #                       connectwise-manage manifest shape both pass.
        #   check_release_assets.py
        #                     - the gate that decides whether a draft release may
        #                       be published. An empty release (the immutable-
        #                       release failure: every asset upload 422s and the
        #                       release goes public with nothing in it), a single
        #                       failed build target, and a missing .mcpb each
        #                       fire, naming exactly the absent files; a complete
        #                       release and a re-run that left an extra asset
        #                       behind both pass; and a tag naming no releasable
        #                       skill expects nothing, so it can never false-RED.
        #                       The size field is checked as a TYPE, so a listing
        #                       carrying "0", "1024", true or NaN fires instead of
        #                       sailing through a truthiness test.
        #   check_release_pipeline.py
        #                     - the gate that decides whether a SHA may be tagged
        #                       at all. A tag push runs release.yml FROM THE
        #                       TAGGED COMMIT, so tagging a pre-draft-pipeline
        #                       commit publishes an empty immutable release and
        #                       spends that version number. Twenty-three broken
        #                       pipeline shapes are refused (publish-first, never
        #                       sealed, two sealers, an uploader outside the seal's
        #                       needs closure, no completeness gate, the gate after
        #                       the seal, no bundle in the contract, comments that
        #                       only QUOTE the commands, a file that is not a
        #                       workflow, and fourteen ways the Windows smoke can be
        #                       missing, outside the seal's closure, pointed at
        #                       the wrong source, a no-op, or allowed to fail). Critically it also asserts THIS repo's
        #                       own release.yml passes: that is what pins the
        #                       probe to the pipeline, so a pipeline change that
        #                       outgrows the probe goes red in the PR that made
        #                       it rather than at release time.
        #                       The --tag mode, which is what the hand-tagging
        #                       path actually calls, is proved the same way: a
        #                       clean tag is endorsed, while a RETIRED version
        #                       number (xero-v0.1.3, whose git tag is free
        #                       because the empty release was deleted), an
        #                       already-cut tag, a SHA stamped at a different
        #                       version, and five shapes that are not release
        #                       tags are each refused - and an unreachable origin
        #                       is NOT, because a DNS blip is not a bad tag. The
        #                       burned-version ledger is proved to fail CLOSED:
        #                       five malformed ledgers raise rather than reading
        #                       as "nothing is burned", while a missing one
        #                       correctly reads as empty.
        #   release_matrix.py - the change-set classifier that decides which
        #                       skills a push or PR builds. A bot regen commit
        #                       (pending.json + .mcpb pin re-mints in skill
        #                       READMEs) yields an EMPTY matrix; a human edit
        #                       to the same README, a Go change, or a per-slug
        #                       skills.json edit yields that skill's row; a
        #                       matrix-row checker or a build-feeding workflow
        #                       yields the FULL matrix; catalog.yml and the
        #                       docs site yield nothing. A Windows known-failures
        #                       edit yields exactly the skills whose exclusions
        #                       changed, and the FULL matrix for an every-
        #                       connector entry or a missing or invalid
        #                       revision. Every case is asserted in both
        #                       directions, offline.
        #   verify_scope.py, check_no_pp_leak.py, check_unix_test_asserts.py
        #                     - the scope, attribution and pre-PR checks behind
        #                       tools/maintainer/verify_all.sh. They run locally
        #                       before a PR; the self-tests here keep them from
        #                       rotting between uses. check_no_pp_leak.py also
        #                       runs as a full audit below (the fleet went clean
        #                       on 2026-10-23).
        #   verify_live.py    - Beta and live-verified are mutually exclusive:
        #                       a verified skill still saying Beta (registry,
        #                       Status paragraph or a stray line), an
        #                       unverified one claiming Live-verified, and an
        #                       unreadable Status file each fail; --sync repairs
        #                       and a flip/revoke round trip is byte-identical.
        #   check_press_metadata.py, check_registry_state.py
        #                     - the press/ folder rules (an extra file such as a
        #                       live dogfood transcript, a stale folder after a
        #                       reprint, a spec that is not the one the press
        #                       read, a personal path, a key block, an empty
        #                       folder each fail; a consistent folder passes),
        #                       the press floor's version order, and the badge
        #                       binding (a hash that is not the tag's code, a
        #                       badge with no binding, each fail).
        run: |
          set -euo pipefail
          python3 tools/maintainer/registry.py --self-test
          python3 tools/maintainer/check_handfixes.py --self-test
          python3 tools/maintainer/mcpb_bundle.py --self-test
          python3 tools/maintainer/check_release_assets.py --self-test
          python3 tools/maintainer/check_release_pipeline.py --self-test
          python3 tools/maintainer/release_matrix.py --self-test
          python3 tools/maintainer/windows_known_failures.py --self-test
          python3 tools/maintainer/verify_scope.py --self-test
          python3 tools/maintainer/check_no_pp_leak.py --self-test
          python3 tools/maintainer/check_unix_test_asserts.py --self-test
          # The recurring-bug-class harness: each class fires on a broken shape
          # and is silent on a healthy one (both directions, offline, no build).
          python3 tools/maintainer/class_harness.py --self-test
          # The verify gate: an unlisted FAIL, a stale baseline entry and an
          # ERROR each block; a baselined FAIL and a retired entry do not.
          python3 tools/maintainer/verify_gate.py --self-test
          python3 tools/maintainer/check_press_metadata.py --self-test
          python3 tools/maintainer/check_registry_state.py --self-test
          python3 tools/maintainer/verify_live.py --self-test

      - name: Merge and release tool self-tests (#422)
        run: |
          python3 -I tools/maintainer/resolve_registry.py --self-test
          python3 -I tools/maintainer/merge_when_green.py --self-test
          python3 -I tools/maintainer/stamp_release.py --self-test
          bash tools/maintainer/cut_tags.sh --self-test

      - name: Class baseline only shrinks (PR cannot widen its own baseline)
        # Build-free guard, mirroring the security gate's baseline-readded check
        # (#429): the working class_baseline.json may only REMOVE connectors vs
        # the baseline at the PR base, never add. Adding a connector means a PR
        # tried to baseline a class it broke instead of fixing it. The per-skill
        # runtime class tests run in the build matrix rows; this just polices the
        # data file against the trusted base. No base (weekly sweep / dispatch)
        # means nothing to compare, so it is skipped there.
        if: github.event_name == 'pull_request'
        run: python3 tools/maintainer/class_harness.py --assert-baseline-shrinks "${{ github.event.pull_request.base.sha }}"

      - name: Verify baseline only shrinks (PR cannot widen its own baseline)
        # Same guard as the class baseline above, for verify_baseline.json: a
        # PR may only REMOVE (connector, feature) pairs vs the PR base. The
        # build rows read the baseline from the base too (--policy-base).
        if: github.event_name == 'pull_request'
        run: python3 tools/maintainer/verify_gate.py --assert-baseline-shrinks "${{ github.event.pull_request.base.sha }}"

      - name: Skill contract (frontmatter + required files)
        run: python3 tools/maintainer/check_skill_contract.py

      - name: One project copyright line (Go headers + connector NOTICE/LICENSE)
        # cli-printing-press stamps the header from whoever ran the generator, so
        # a reprint reintroduces an individual's name into files the project owns
        # (cli-printing-press#4326). Before 2026-08-23 that had produced TEN
        # different copyright strings across 19,307 files, nine connectors
        # disagreeing with themselves.
        #
        # This runs HERE and not only in verify_all.sh because verify_all.sh is a
        # local convenience, not a merge gate: a reprint PR that never runs it
        # would land the personal headers with CI green. The scan is whole-fleet
        # and takes about a second, so it is cheap enough to run on every PR
        # rather than only on the connectors a PR touched.
        run: python3 tools/maintainer/check_copyright.py

      - name: MCP-surface rules over the whole fleet (the baseline only shrinks)
        # The seven MCP-surface rules in check_security_gate.py (unauthenticated HTTP
        # transport, mcp-go without the DNS-rebinding guard, an ungated _execute,
        # write tools labeled non-destructive, verb-named GETs run as reads, the share
        # command, typed tools the read-only switch misses). The security-gate rows
        # apply them to the connectors a PR touches; this step applies them to the
        # WHOLE fleet on every PR, every push to main and the weekly sweep, and prints
        # the per-rule counts. A connector listed for a rule in
        # tools/maintainer/security_gate_baseline.json is known exposure awaiting its
        # reprint and only reports; any other failure fails. On a PR the baseline is
        # read from the base commit, so a slug the PR adds to it fails instead.
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            python3 -I tools/maintainer/check_security_gate.py --mcp-surface --all --report --policy-base "$PR_BASE"
          else
            python3 -I tools/maintainer/check_security_gate.py --mcp-surface --all --report
          fi

      - name: Markdown local links
        run: python3 tools/maintainer/check_md_links.py

      - name: Manifest env schema matches the binaries' reads
        # Asserts every operator-facing env var a connector READS is declared in
        # manifest.json (server.mcp_config.env + a user_config prompt), in
        # server.json (the MCP Registry), and in mcp-install.md (the manual
        # path). Claude Desktop has no shell and no config.toml, so an
        # undeclared variable is a credential the operator is never asked for:
        # the server boots, tools/list looks healthy, and the first real call
        # fails. Issue #282 - 60 of 65 connectors under-declared, cove 0 of 4
        # and quickbooks 1 of 8.
        #
        # Runs HERE and not in the per-skill matrix for two reasons: the
        # classification rules must be read from the merge BASE so a PR cannot
        # widen its own internal-prefix list to silence a credential, and this
        # job already checks out with fetch-depth: 0, so BASE resolves without
        # adding a full-history clone to each of the 65 matrix legs.
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python3 tools/maintainer/check_env_schema.py --base "$BASE"

      - name: server.json is publishable to the MCP Registry
        # The registry validates server.json and answers 422 on a violation, and
        # mcp-publish.yml publishes AFTER the release assets are uploaded - so a
        # rejection leaves a release that looks complete while the connector never
        # reaches the registry or the six catalogues that fan out from it.
        # avanan hit this on 2026-08-26: a 107-character description against a
        # 100-character limit. Validated against the registry's own JSON Schema,
        # vendored beside the checker so CI needs no network and a silently-updated
        # remote schema cannot turn main red without a commit.
        run: python3 tools/maintainer/check_mcp_registry.py

      - name: Install and remote-MCP docs match the shipped artifacts
        # Reads doc prose against main.go, install.ps1 and install.sh - never
        # against another doc. Catches the four defects that rode the whole fleet
        # because no gate compared an instruction to the artifact that has to
        # satisfy it: `mcp-remote` named as a stdio publisher (it bridges the
        # other direction and exits ERR_INVALID_URL), `--transport http` on the
        # binaries that never parse it, bare `localhost:7777` when mcp-go serves
        # at /mcp, and the printing-press-library installer + PrintingPress\bin
        # destination this repo does not use. Runs in this single job, so it adds
        # no build-matrix rows. See issues #237, #240, #241.
        run: python3 tools/maintainer/check_install_docs.py

      - name: Install-doc gate discriminates (fires on broken, silent on fixed)
        run: python3 tools/maintainer/check_install_docs.py --selftest

      - name: No TODO / placeholder markers in skill prose
        run: python3 tools/maintainer/check_no_todos.py

      - name: Vocabulary contract (banned + required terms)
        run: python3 tools/maintainer/check_vocabulary.py

      - name: No connector's -pp- name on a user-facing surface (full audit)
        # Every skill's pages, manifests, installers, cli/NOTICE and Go help
        # strings, plus the shared catalogs. 85 leaks shipped because this ran
        # only before a PR, with a ratchet that grandfathered old lines; the
        # 2026-10-23 sweep removed them, so any finding now is new. Go module
        # and import paths keep -pp- on purpose and are not findings.
        run: python3 tools/maintainer/check_no_pp_leak.py --all

      - name: Beta and live-verified agree (registry, README, pain-point)
        # A live-verified connector never says Beta; an unverified one never
        # claims Live-verified. verify_live.py moves all three with the badge;
        # this catches a hand edit, a stale merge or a flip done another way.
        run: python3 tools/maintainer/verify_live.py --check

      - name: AEO contract (answer-first, unique titles, connector formula)
        run: python3 tools/maintainer/check_aeo.py

      - name: Video assets (skills that opt in via has_video)
        run: python3 tools/maintainer/check_video_assets.py

      # Four gates the publish flow calls mandatory that ran only in
      # verify_all.sh, so a PR that skipped it merged without them. Each is
      # stdlib-only and fleet-wide in about a second, and each passed on main
      # (6416a241b) when it moved here.
      - name: Social preview assets (every skill + the pack)
        run: python3 tools/maintainer/check_social_assets.py

      - name: README media block (every connector)
        run: python3 tools/maintainer/check_media_block.py

      - name: Surface coverage (catalog + README hero, install and agent blocks)
        run: python3 tools/maintainer/check_surface_coverage.py

      - name: Registry state never regresses (live_verified downgrade, shape)
        # Compares skills.json with BASE: the PR base, or on a push to main
        # github.event.before, because by then the runner's origin/main
        # already contains the push and would compare it with itself. On the
        # weekly sweep there is no base and origin/main (from the fetch-depth:
        # 0 checkout above) is used. An unreadable baseline is an error, never
        # a pass.
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # A force-push can name a `before` the checkout never fetched: fetch
          # it; if it is still unreadable the check fails closed (exit 2).
          if [ -n "${BASE:-}" ]; then git fetch -q origin "$BASE" 2>/dev/null || true; fi
          python3 tools/maintainer/check_registry_state.py ${BASE:+--base "$BASE"}

      - name: Press metadata beside each connector, and the press floor for new ones
        # skills/<dir>/press/ holds the press's own provenance, tools manifest
        # and spec (onboard.py vendors it beside cli/). Where one exists it
        # must agree with manifest.json and carry nothing secret-looking; a
        # connector without one is reported in the coverage line, not failed.
        # With a base, a connector this change ADDS must have been printed at
        # or above tools/maintainer/press_floor.json (upstream's own declared
        # minimum); the floor and its exemptions are read from the base too,
        # so a PR cannot lower its own bar. Existing connectors are untouched.
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${BASE:-}" ]; then git fetch -q origin "$BASE" 2>/dev/null || true; fi
          python3 tools/maintainer/check_press_metadata.py ${BASE:+--base "$BASE"}

      - name: DCO sign-off (PR commits)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash tools/maintainer/check_dco.sh

      - name: ShellCheck
        # tools/maintainer/hooks/* is listed explicitly: a git hook cannot carry
        # a .sh extension (git runs the file by its hook NAME), so the '*.sh'
        # glob would leave the one script whose failure mode is silent - an
        # uninstallable or crashing pre-push hook that lets an unendorsed
        # release tag through - as the only unlinted shell in the repo.
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          mapfile -t scripts < <(git ls-files '*.sh' 'tools/maintainer/hooks/*')
          if [ ${#scripts[@]} -gt 0 ]; then
            shellcheck "${scripts[@]}"
          fi

      - name: Secret scan (gitleaks)
        env:
          GL_VERSION: "8.18.4"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$url" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --no-git --source . --config .gitleaks.toml --redact --no-banner

      - name: Plugin manifest validation (claude plugin validate --strict)
        env:
          CI: "true"
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code
          # Marketplace manifest + every per-skill plugin manifest. --strict
          # fails on unknown fields (e.g. a stray `vendor`) and missing metadata.
          claude plugin validate . --strict
          for d in skills/*/; do
            [ -f "${d}.claude-plugin/plugin.json" ] || continue
            claude plugin validate "skills/$(basename "$d")" --strict
          done

  # The analyzer behind "No MCP tool call can name a local path" proved both
  # directions on a fixture module: every flag named want-* in
  # tools/maintainer/mcp_file_flags/testdata/fixture reaches a filesystem path
  # through a different data-flow shape and must be reported; every comp-*
  # flag is only a component inside a directory the program chose and must be
  # reported as such; every not-* flag (printed, hashed, parsed as a number,
  # sent to an API, used only to select a fixed path) must not be. One job,
  # not one per matrix row: the fixture does not change with the connector.
  mcp-file-flags-analyzer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/maintainer/mcp_file_flags/go.mod
          cache-dependency-path: |
            tools/maintainer/mcp_file_flags/go.sum
            tools/maintainer/mcp_file_flags/testdata/fixture/go.sum

      - name: Analyzer self-test (fires on every want- flag, silent on every not- flag)
        working-directory: tools/maintainer/mcp_file_flags
        run: |
          go vet ./...
          go test -count=1 ./...

      - name: Component-flag validators reject hostile values (one place, not 31 connectors)
        run: python3 tools/maintainer/check_mcp_file_flags.py --check-component-validators

  # Its own job, deliberately. This check is RED BY DESIGN for a release that
  # was never cut: once a version bump has been on main for longer than the
  # in-flight window (PINS_INFLIGHT_HOURS, default 24) with no tag, every run
  # fails until the tag is cut. While it was a
  # step inside `guards`, that red skipped every step after it - env schema,
  # MCP registry, install docs, DCO, ShellCheck, gitleaks, plugin validate: a
  # dozen unrelated gates silently not run on exactly the commits that most
  # need them. Here it can only ever fail itself.
  pins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # every tag local, BASE resolvable, no network call

      - name: Pins gate self-test (every rule, both directions)
        # Throwaway git repos: the rename, cross-file-move, one-uncut-bump and
        # retired-version rules, and the in-flight window (a bump 1h old passes,
        # 30h old fails, a recent edit to another field cannot reopen a dead
        # pin, a pull request's own commits and a merged branch's commit date
        # cannot extend it, window 0 turns it off).
        run: python3 tools/maintainer/check_pinned_artifacts.py --self-test

      - name: Pinned release URLs resolve (tag cut, or an in-flight release)
        # check_md_links.py skips http(s) entirely, so nothing verified that the
        # version-pinned .mcpb identifiers and release links this repo publishes
        # point at a tag that exists. On 2026-08-25 seventy of them did not: a
        # version bump rewrites the pin, the tag is cut by hand afterwards, and
        # skipping that step leaves main serving a 404 forever.
        #
        # BASE is what makes this checkable without failing every release
        # commit: a pin that is NEW or MOVED in this change-set is an in-flight
        # release (allowed, with a reminder).
        #
        # A pin that was already at BASE, whose tag does not exist, is either a
        # release that was never cut or a release wave still cutting its tags
        # (cut_tags.sh pushes one tag at a time with at most four in flight, so
        # 81 connectors take hours). Telling them apart is the in-flight window:
        # the pin is IN FLIGHT (allowed, with the same reminder) when the
        # first-parent commit on BASE that bumped that slug's manifest to that
        # version is less than PINS_INFLIGHT_HOURS (default 24, unset here; 0
        # turns the window off) old by its committer date, measured against
        # this run's clock, and the usual per-slug rules hold (the version
        # before it was tagged or retired). Older than that it FAILS: the
        # release was never cut and main is publishing a 404. The age comes
        # from git history alone, never from the pull request's own commits,
        # so this stays offline. Before the window, every unrelated PR was red
        # for the whole length of a wave.
        #
        # On a push BASE must be github.event.before, NOT origin/main: the
        # runner's origin/main already contains the push. The checkout above is
        # fetch-depth: 0, so every tag is local and no network call is made.
        # On the weekly sweep and on workflow_dispatch there is no base; the
        # script says so and skips the tag-existence check rather than
        # inventing one.
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        # Hard gate. The backlog this shipped in warn mode for - 62 pins across
        # 31 connectors whose releases were never cut - was cleared by the
        # 65-tag push on 2026-08-26. All 192 pinned release URLs across 128
        # files now resolve, verified by HTTP HEAD against every one of them, so
        # any new finding here is a new defect and should block.
        run: python3 tools/maintainer/check_pinned_artifacts.py --base "$BASE" --no-network

  # Skill build matrix is computed from the repo, so a new skill is built+vetted
  # with no edit here (mirrors the release workflow). The matrix is SCOPED to
  # the skills the change-set touched: on a PR that is the diff against the
  # merge-base; on a push to main it is the two-point diff from
  # github.event.before, the tip main had before the push, to HEAD - exactly
  # what the push changed, including what a force-push took away. At fleet
  # scale (65 skills) an unscoped matrix is 65 jobs and ~210-240 runner-minutes
  # per run, and before 2026-09-07 every push to main paid it: the catalog
  # bot's "regenerate derived files" commits (11 in one day, docs only) each
  # burned a full matrix, and during a 21-tag release wave those runs pinned
  # the org's runner pool (59 of 60 busy, 232 queued) so the RELEASE builds
  # starved.
  #
  # release_matrix.py classifies the change-set (see its MACHINERY / DERIVED
  # lists and --self-test): derived files the bot commits yield NO row, a
  # human edit to a skill yields that skill's row, and a change to build
  # machinery yields the FULL matrix. It fails open (full matrix) whenever the
  # diff cannot be computed. The full matrix also runs on the weekly schedule
  # and on workflow_dispatch, which is what bounds the scoping.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      any: ${{ steps.gen.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history for the merge-base (PRs) and `before` (pushes)
      - name: Compute skill matrix
        id: gen
        env:
          EVENT_NAME: ${{ github.event_name }}
          # PRs: the merge base. Pushes: github.event.before. Anything else
          # (schedule, workflow_dispatch) has no base and builds everything.
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.event.before) || '' }}
        run: |
          set -euo pipefail
          zeros='0000000000000000000000000000000000000000'
          base=""
          if [ -z "$BASE_SHA" ]; then
            echo "no diff base for a '$EVENT_NAME' event - building the FULL matrix"
          elif [ "$BASE_SHA" = "$zeros" ]; then
            # Branch creation (or a push whose `before` GitHub could not name).
            echo "::warning::base is the all-zeros SHA - building the FULL matrix"
          else
            # A force-push or a rewritten history can name a `before` this
            # clone never received; fetching it is best-effort, and a base the
            # checkout cannot resolve means the FULL matrix (fail open), never
            # an empty one. release_matrix.py fails open the same way if the
            # merge-base or diff below errors.
            git fetch -q origin "$BASE_SHA" 2>/dev/null || true
            if git rev-parse --verify --quiet "${BASE_SHA}^{commit}" >/dev/null; then
              base="$BASE_SHA"
            else
              echo "::warning::base $BASE_SHA is not reachable from this checkout - building the FULL matrix"
            fi
          fi
          if [ -n "$base" ] && [ "$EVENT_NAME" = "pull_request" ]; then
            echo "diff base (merge-base): $base"
            matrix="$(python3 tools/maintainer/release_matrix.py --skills-only --changed-only "$base")"
          elif [ -n "$base" ]; then
            # Two-point diff, deliberately not a merge-base: a force-push that
            # rewinds main to an ancestor has merge-base == HEAD and would
            # diff nothing; the files it removed still need their rows built.
            echo "diff base (two-point, github.event.before): $base"
            matrix="$(python3 tools/maintainer/release_matrix.py --skills-only --changed-since "$base")"
          else
            matrix="$(python3 tools/maintainer/release_matrix.py --skills-only)"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "any=$(printf '%s' "$matrix" | python3 -c 'import json,sys; print(str(len(json.load(sys.stdin)["skill"])>0).lower())')" >> "$GITHUB_OUTPUT"
          printf '%s' "$matrix" | python3 -c 'import json,sys; m=json.load(sys.stdin); print("matrix skills:", [s["name"] for s in m["skill"]] or "(none - build job will skip)")'

  build:
    needs: prepare
    if: needs.prepare.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.skill.dir }}/go.mod
          # The newest patch of the go line, every run, never whichever patch
          # the runner image happens to cache: the same Go verify_all.sh
          # predicts with (it resolves the spec against this same manifest).
          check-latest: true
          # Module + build cache for these VERIFICATION rows only. Without a
          # dependency path setup-go logged "Dependencies file is not found"
          # and every row ran cold. One key over every connector's go.sum: a
          # cache per connector would be 84 entries and overrun the
          # repository's cache quota, while the heavy shared dependencies
          # (modernc sqlite, mcp-go, cobra) are the same everywhere.
          # release.yml stays uncached on purpose, so a cache written from a
          # PR run can never reach a sealed artifact.
          cache-dependency-path: skills/*/cli/go.sum

      - name: Build and vet
        run: |
          cd ${{ matrix.skill.dir }}
          go build ./...
          go vet ./...

      # Cross-compile for every platform the release matrix ships, so a
      # platform-specific compile break is caught HERE and not from a missing
      # artifact after a tag push.
      #
      # auvik shipped exactly that: `syscall.Flock` in a novel command file with
      # no build tag, which does not exist on Windows. It merged with CI green
      # because CI built only for the runner's platform, and the six-target
      # matrix runs on a TAG PUSH. The first real tag published 16 assets
      # instead of 25 while every job stayed green - a partial asset set fails
      # nothing. See the auvik Windows-build fix and issue #249 for the same
      # shape one layer up.
      #
      # Compile only (`go build`), no vet or test: this is about "does it
      # compile for the targets we ship", and it adds a few seconds per row.
      - name: Cross-compile every released target
        run: |
          cd ${{ matrix.skill.dir }}
          fail=0
          for pair in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os="${pair%/*}"; arch="${pair#*/}"
            if ! GOOS="$os" GOARCH="$arch" go build ./... 2>build.err; then
              echo "::error::does not compile for $pair"
              sed 's/^/    /' build.err
              fail=1
            fi
          done
          rm -f build.err
          exit "$fail"

      - name: CLI claims vs built binary (this skill)
        # Runs here, in the per-skill matrix job, because verifying doc claims
        # builds the real CLI and needs Go on PATH (already set up above). The
        # --slug filter checks only this matrix row's skill.
        #
        # Hard gate. It shipped behind --warn "while the fleet calibrates", and
        # --warn exits 0 on real findings, so a README telling an MSP to run a
        # flag the binary rejects printed the defect and left the verdict
        # green. The fleet has been clean since: a hard-mode run over all 65
        # connectors on 2026-09-07 returned 0 findings, so a finding here is a
        # new defect and blocks.
        run: python3 tools/maintainer/check_cli_claims.py --slug ${{ matrix.skill.name }}

      - name: Hand-fix ledger intact (this skill)
        # Hard gate: if this skill carries a skills/<slug>/handfixes.json ledger,
        # assert every recorded connector hand-fix marker is still present. A
        # cli-printing-press reprint can silently clobber edits to generated
        # files (go test stays green); this turns that into a loud failure.
        # No-op for skills without a ledger. See docs/reprint-survival.md.
        run: python3 tools/maintainer/check_handfixes.py --slug ${{ matrix.skill.name }}

      - name: No default-denied MCP tool (this skill)
        # Hard gate: boot this skill's MCP server over stdio and call the tools
        # the tenant-gate middleware wraps in-process, asserting none answers a
        # gate refusal. Issue #249 shipped three connectors where 6 tools each
        # were dead while build, vet, go test, the security gate and tools/list
        # were all green - only tools/call could see it. Needs no credentials
        # and runs in about a second on a warm build cache.
        run: python3 tools/maintainer/check_mcp_gate.py --slug ${{ matrix.skill.name }}

      - name: No MCP tool call can name a local path (this skill)
        # Hard gate. The MCP server runs this skill's CLI as the account that
        # hosts it: the operator at the command line is trusted, an MCP caller
        # (possibly an agent following injected instructions) is not. So a flag
        # whose value names a file or directory the CLI reads or writes must be
        # refused over MCP while the CLI keeps it.
        #
        # That rule was enforced flag by flag, from usage text: PR #416 (teach
        # file flags in 5 connectors), PR #423 (7 flags in 5 more), and a probe
        # that then found `import --input` in 5 more, riverside-fm --db/--out
        # and superops --vars @path. This step derives the set from the CODE
        # instead: tools/maintainer/mcp_file_flags runs a taint analysis over
        # the connector's SSA form and lists every flag whose value can start a
        # filesystem path (open, read, write, stat, mkdir, walk, exec, @path),
        # then the script boots the real MCP server beside a recording stand-in
        # for the CLI and asserts, for every mirrored tool, that each such flag
        # is absent from the input schema AND refused by name when supplied (a
        # silent drop fails: it answers a different question than was asked),
        # that an ordinary flag still reaches the CLI, and that no in-process
        # tool hands request data to a filesystem call. Needs no credentials.
        timeout-minutes: 20
        run: python3 tools/maintainer/check_mcp_file_flags.py --slug ${{ matrix.skill.name }}

      - name: Doctor reports a verdict that tracks reality (this skill)
        # Hard gate: build this skill's CLI and run `doctor --json` against a
        # local stub HTTP server in four states - healthy, expired credential,
        # a base URL where every API path 404s, and the connector's own shipped
        # placeholder default. Assert doctor never reports a healthy verdict in
        # a state that is provably broken, and never tells a correctly
        # credentialled operator they are broken without naming the variable
        # that fixes it.
        #
        # Issue #282: `cipp-cli doctor` printed an identical all-green report
        # for a wrong base URL, a correct config, and a token rejected with 401
        # on every call; `zammad-cli doctor` printed every row green - including
        # "Credentials: ok" - against its own placeholder host with the literal
        # token "totally-bogus-token", and exited 0 under --fail-on error.
        # 41 of 65 connectors never probed the credential at all.
        #
        # Needs no vendor credentials and no network: the stub binds 127.0.0.1
        # and the fixture config carries a literal auth_header.
        run: python3 tools/maintainer/check_doctor_truth.py --slug ${{ matrix.skill.name }}

      - name: Recurring bug-class tests (this skill, black box)
        # Build this connector's CLI + MCP and drive them against a local fake
        # server for the recurring CLASSES (secret echo, auth on the wire, write
        # safety). Connector-agnostic: no per-connector Go import; the surface
        # comes from the binary's agent-context and the wiring from manifest.json.
        # A connector listed in class_baseline.json for a class is reported, not
        # failed (the list only shrinks; the guards job proves a PR did not widen
        # it). A change to the harness itself is MACHINERY, so it re-runs the
        # whole fleet. Runs even if a build step above failed, so one row reports
        # everything. See tools/maintainer/README.md "Class tests".
        if: ${{ !cancelled() }}
        run: python3 tools/maintainer/class_harness.py --slug ${{ matrix.skill.name }}

      - name: User path drives as designed (verify-msp-skills, this skill)
        # .claude/skills/verify-msp-skills drives the BUILT connector the way a
        # user does, in a scratch HOME against a fake vendor on 127.0.0.1 (proxy
        # variables point every other host at it, which refuses and logs them):
        # install.sh against a release fixture, MCP stdio (a real read call
        # reaches the vendor), MCP HTTP (no token = refuse or loopback only;
        # bearer auth enforced), write gating (preview first, send only on
        # confirm), the read-only switch, and local data. verify_gate.py reads
        # its verdict.json against tools/maintainer/verify_baseline.json, the
        # features each connector fails on main today (3 to 6 fail by design
        # before press 4.34.0): an unlisted FAIL blocks, a listed feature that
        # now passes blocks until its entry is removed, an ERROR blocks as a
        # harness error unless it is one of the harness errors the fleet had
        # when the baseline was seeded (known_errors: reported, not gating,
        # kept visible by verify-watch). On a PR the baseline is read from the
        # base commit, so a PR cannot widen its own; the guards job proves it
        # only shrinks. Measured on the seeding run (84 rows): median 32s
        # added per row, 155s worst, 52 runner-minutes for the full matrix.
        # The default-port check (7777) is per machine, and each row is its own
        # machine. Runs even if an earlier step failed, so one row reports all.
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        env:
          SLUG: ${{ matrix.skill.name }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          start="$(date +%s)"
          out="$RUNNER_TEMP/verify-gate"
          policy=()
          if [ "$EVENT" = pull_request ]; then
            # Shallow checkout: fetch the base commit so --policy-base can read
            # the trusted baseline. Unreadable after this, the gate fails closed.
            git fetch -q --no-tags --depth=1 origin "$PR_BASE" || true
            policy=(--policy-base "$PR_BASE")
          fi
          echo "base fetch: $(( $(date +%s) - start ))s"
          rc=0
          python3 -I tools/maintainer/verify_gate.py --slug "$SLUG" ${policy[@]+"${policy[@]}"} \
            --evidence-root "$out/evidence" --record "$out/gate.json" || rc=$?
          echo "verify gate wall time: $(( $(date +%s) - start ))s"
          exit "$rc"

      - name: Keep the verify verdict (seeding and verify-watch read it)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ matrix.skill.name }}
          path: |
            ${{ runner.temp }}/verify-gate/gate.json
            ${{ runner.temp }}/verify-gate/evidence/**/verdict.json
            ${{ runner.temp }}/verify-gate/evidence/**/SUMMARY.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Test (linux, native)
        # Until this step the only `go test` in CI ran on the Windows rows, so a
        # test that only passes or only runs on Linux (a POSIX permission or
        # signal test guarded by runtime.GOOS) was never executed anywhere, and
        # pushes to main ran no test at all. Runs even when an earlier step
        # failed, so one row reports every finding. -count=1: the restored
        # build cache also holds test results, and a gate must run the tests.
        # Before this became blocking, all 84 connectors passed `go test ./...`
        # on Linux (Go 1.26.9, non-root), with no exclusions.
        if: ${{ !cancelled() }}
        run: |
          cd ${{ matrix.skill.dir }}
          go test -count=1 ./...

  # Windows is where most MSPs run these connectors, and until this job no
  # test and no binary ever ran there: `build` cross-compiles windows/amd64 and
  # windows/arm64 on Linux, which proves the code COMPILES for Windows and
  # nothing else. This job runs on a real Windows machine, per changed skill
  # (the same scoped matrix as `build`):
  #   go vet ./...    native windows/amd64, test files included;
  #   go test ./...   the connector's own tests: path joins, file locking, the
  #                   SQLite store, rename/remove of open files, CRLF and the
  #                   like behave differently on Windows, and only a Windows
  #                   test run shows it. (No other job runs `go test`.);
  #   windows_smoke.ps1
  #                   the CLI and MCP server built natively and run the way an
  #                   MSP runs them (no HOME, a Windows profile, the MCP server
  #                   finding its companion CLI .exe) - the same script
  #                   release.yml runs against the draft before every seal, so
  #                   a Windows break shows up here, on the PR, rather than as
  #                   a stranded draft at release time.
  #
  # Cost, deliberately bounded. Windows runners are the slow, expensive ones,
  # so this job:
  #   * skips pushes to main. The PR run already tested the same change-set
  #     merged onto main, and a push re-run would double every matrix. The
  #     weekly full sweep and workflow_dispatch still run it, which bounds what
  #     a merge race could slip past;
  #   * caps itself at 20 parallel rows, so a full-fleet run (a workflow or
  #     machinery change) queues behind itself instead of pinning the org's
  #     runner pool and starving release builds, the 2026-09-07 failure mode;
  #   * checks out only this skill and tools/maintainer (sparse), since a full
  #     Windows checkout of the repo is most of a minute on its own.
  windows:
    needs: prepare
    if: needs.prepare.outputs.any == 'true' && github.event_name != 'push'
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      MODULE: ${{ matrix.skill.module }}
      CLI_CMD: ${{ matrix.skill.cli_cmd }}
      MCP_CMD: ${{ matrix.skill.mcp_cmd }}
      CLI_BIN: ${{ matrix.skill.cli_bin }}
      MCP_BIN: ${{ matrix.skill.mcp_bin }}
    steps:
      - name: Check out with LF line endings
        # The runner's git defaults to core.autocrlf=true, which would rewrite
        # every embedded file and golden fixture to CRLF. Released binaries are
        # built on Linux from LF sources, so a CRLF checkout would test files
        # no user ever runs and red tests over line endings nobody ships.
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            skills/${{ matrix.skill.name }}
            tools/maintainer

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.skill.dir }}/go.mod
          check-latest: true  # as in the build job: never the runner image's cached patch
          cache-dependency-path: ${{ matrix.skill.dir }}/go.sum

      - name: Vet (windows/amd64, native)
        working-directory: ${{ matrix.skill.dir }}
        run: go vet ./...

      - name: Test (windows/amd64, native)
        # Gates on every test EXCEPT the ones recorded in
        # tools/maintainer/windows_known_test_failures.json: diagnosed Windows
        # failures whose fixes live elsewhere (a real bug in generated code, or
        # a test that assumes Unix). Those still run in the next step and are
        # reported there; a failure NOT in the ledger fails this row.
        working-directory: ${{ matrix.skill.dir }}
        env:
          SLUG: ${{ matrix.skill.name }}
        run: |
          set -euo pipefail
          known="$(python "$GITHUB_WORKSPACE/tools/maintainer/windows_known_failures.py" --slug "$SLUG")"
          known="${known%$'\r'}"
          if [ -n "$known" ]; then
            echo "Recorded known Windows failures for $SLUG run in the next step, not here: $known"
            go test -skip "$known" ./...
          else
            go test ./...
          fi

      - name: Known Windows failures (run and reported, never gating)
        if: ${{ !cancelled() }}
        working-directory: ${{ matrix.skill.dir }}
        env:
          SLUG: ${{ matrix.skill.name }}
        run: |
          set -uo pipefail
          known="$(python "$GITHUB_WORKSPACE/tools/maintainer/windows_known_failures.py" --slug "$SLUG")"
          known="${known%$'\r'}"
          if [ -z "$known" ]; then
            echo "No known Windows failures recorded for $SLUG."
            exit 0
          fi
          # GitHub runs bash with -e: capture the expected failure explicitly.
          status=0
          go test -count=1 -v -run "$known" ./... > "$RUNNER_TEMP/known.log" 2>&1 || status=$?
          ran="$(grep -cE '^=== RUN +Test[^/]*$' "$RUNNER_TEMP/known.log" || true)"
          failed="$(grep -cE '^--- FAIL: ' "$RUNNER_TEMP/known.log" || true)"
          if [ "$ran" -eq 0 ] && [ "$status" -eq 0 ]; then
            echo "None of the recorded known Windows failures exist in $SLUG."
          elif [ "$status" -eq 0 ]; then
            # Exit 0 is the only proof they passed: a panic or a build failure
            # can leave no `--- FAIL:` line behind.
            echo "::notice title=windows known failures::all $ran recorded known Windows failure(s) in $SLUG now PASS; remove them from tools/maintainer/windows_known_test_failures.json"
          else
            echo "::warning title=windows known failures::recorded known Windows failures still fail in $SLUG ($failed --- FAIL line(s) among $ran run, go test exit $status); tracked in tools/maintainer/windows_known_test_failures.json, not gating"
          fi
          grep -E -- '^--- FAIL: |^(ok|FAIL)[[:space:]]' "$RUNNER_TEMP/known.log" || true
          exit 0

      - name: Build the CLI and MCP server the way release.yml does
        # Runs (and so does the smoke) even when a test failed: "a test is
        # Unix-only" and "the binary cannot run on Windows" are different
        # findings, and one run should report both.
        if: ${{ !cancelled() }}
        working-directory: ${{ matrix.skill.dir }}
        # Same flags as the release build, so the smoke below also proves the
        # version stamp lands in a Windows binary.
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/winbin"
          mkdir -p "$out"
          go build -trimpath -ldflags "-s -w -X ${MODULE}/internal/cli.version=0.0.0-windows-ci" -o "$out/${CLI_BIN}.exe" "$CLI_CMD"
          go build -trimpath -ldflags "-s -w -X main.version=0.0.0-windows-ci" -o "$out/${MCP_BIN}.exe" "$MCP_CMD"

      - name: Run them on Windows (Windows PowerShell 5.1)
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\maintainer\windows_smoke.ps1 `
            -BinDir (Join-Path $env:RUNNER_TEMP "winbin") -CliName $env:CLI_BIN -McpName $env:MCP_BIN `
            -ExpectedVersion 0.0.0-windows-ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
