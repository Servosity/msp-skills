name: Live-verified badge from issue

# When a maintainer labels an "it works" report with "confirmed-works", flip the
# named skill to live-verified in the registry, regenerate the catalog, commit
# to main, and thank the reporter. Docs-only: this never cuts a release.
#
# The trigger is the label event, NOT issue creation, so a human always
# confirms the report before the badge flips. The issue must ALSO carry the
# "live-verified-report" label (the it-works.yml form applies it automatically),
# so an unrelated issue tagged "confirmed-works" cannot trip this workflow.

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

# Per-ISSUE group, deliberately NOT the shared 'main-autocommit' group: badge
# flips are per-issue and not interchangeable, and GitHub keeps only ONE pending
# run per group (an older queued flip would be silently replaced by a newer one
# and that slug would never get badged). The per-issue group still dedupes
# re-labels of the same issue; races against catalog.yml's pushes to main are
# handled by the regenerate-on-top push-retry loop below.
concurrency:
  group: live-verified-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  flip:
    runs-on: ubuntu-latest
    # Only run when the label just applied is "confirmed-works" AND the issue
    # also has the "live-verified-report" label from the it-works form.
    if: >-
      github.event.label.name == 'confirmed-works' &&
      contains(github.event.issue.labels.*.name, 'live-verified-report')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Push as the repo admin (fine-grained PAT) so the commit bypasses the
          # required security-gate check that GITHUB_TOKEN cannot. Falls back to
          # GITHUB_TOKEN when the secret is absent. See security-gate.yml.
          token: ${{ secrets.CATALOG_PUSH_TOKEN || github.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse skill slug from issue body
        id: parse
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          set -euo pipefail
          # Read the slug from the issue body. GitHub renders the "Which skill"
          # dropdown as a "### Which skill" heading followed by the value on the
          # next non-empty line. We tolerate absence (older issues, manual
          # reports) and emit ok=false so the next step comments + exits 0.
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re

          event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          issue = event.get("issue") or {}
          body = issue.get("body") or ""
          title = issue.get("title") or ""

          # Known slugs come from the registry; a slug only counts once it is
          # registered. verify_live.py is the final gate, but we pre-check here
          # so we can leave a helpful comment.
          reg = json.load(open("tools/maintainer/skills.json"))
          known = set(reg.get("skills", {}))

          # 1) The dropdown value (the structured signal). GitHub renders the
          # "Which skill" dropdown as a "### Which skill" heading followed by the
          # value on the next non-empty line.
          dropdown = ""
          lines = body.splitlines()
          for i, line in enumerate(lines):
              if re.match(r"^#{1,6}\s*Which skill\s*$", line.strip(), re.IGNORECASE):
                  for nxt in lines[i + 1:]:
                      val = nxt.strip()
                      if val and not val.startswith("#"):
                          dropdown = val
                          break
                  break
          dropdown = dropdown.strip().lower()
          if dropdown in ("other / not listed", "other", "not listed", ""):
              dropdown = ""

          # 2) Independent evidence from the title + body free-text - HIGH-signal
          # only: an explicit "<slug>-mcp"/"<slug>-cli" mention, or the slug (with
          # separators stripped, >=5 chars to avoid short-slug noise) appearing in
          # the normalized title. This is a SAFETY CROSS-CHECK, never an
          # auto-picker: when it disagrees with the dropdown we refuse and defer
          # to a human - we never badge from a guess. (A reporter once picked
          # "servosity" for a SentinelOne report, #116; this catches that.)
          hay = (title + "\n" + body).lower()
          norm_title = re.sub(r"[^a-z0-9]", "", title.lower())
          evidence = set()
          for k in known:
              kn = re.sub(r"[^a-z0-9]", "", k)
              if f"{k}-mcp" in hay or f"{k}-cli" in hay:
                  evidence.add(k)
              elif len(kn) >= 5 and kn in norm_title:
                  evidence.add(k)

          # 3) Decide. Auto-badge ONLY when the dropdown names a known slug AND
          # the independent evidence does not point at a DIFFERENT one. Unknown/
          # "other" dropdown, or a dropdown-vs-evidence conflict, bails to the
          # manual path - fail-safe, never a wrong badge.
          conflict = bool(
              dropdown and dropdown in known and evidence and dropdown not in evidence
          )
          ok = "true" if (dropdown and dropdown in known and not conflict) else "false"
          # A single unambiguous inferred slug makes the maintainer's manual flip
          # trivial; surface it for the bail-path comment.
          inferred = next(iter(evidence)) if len(evidence) == 1 else ""

          print(f"ok={ok}")
          print(f"slug={dropdown}")
          print(f"inferred={inferred}")
          print(f"conflict={'true' if conflict else 'false'}")
          PY

      - name: Comment that a maintainer must verify manually (parse failed)
        if: steps.parse.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          SLUG: ${{ steps.parse.outputs.slug }}
          INFERRED: ${{ steps.parse.outputs.inferred }}
          CONFLICT: ${{ steps.parse.outputs.conflict }}
        run: |
          set -euo pipefail
          if [ "$CONFLICT" = "true" ]; then
            note="the report's \"Which skill\" dropdown says '$SLUG' but the title/body looks like '$INFERRED' - they disagree, so we did not badge automatically"
          elif [ -n "$SLUG" ]; then
            note="the skill '$SLUG' from this report is not a registered skill yet"
          elif [ -n "$INFERRED" ]; then
            note="the report did not pick a listed skill, but the title/body looks like '$INFERRED'"
          else
            note="we could not read the skill from this report"
          fi
          hint="\`python3 tools/maintainer/verify_live.py\`"
          if [ -n "$INFERRED" ]; then
            hint="\`python3 tools/maintainer/verify_live.py --slug $INFERRED --source github --evidence <this issue URL>\`"
          fi
          gh issue comment "$ISSUE" --body "Thanks for the report. Automation did not badge this automatically: $note. A maintainer will verify by hand ($hint). No action needed from you."
          echo "Bailed to manual path (ok!=true); commented and exiting cleanly."

      - name: Flip the badge to live-verified
        if: steps.parse.outputs.ok == 'true'
        env:
          SLUG: ${{ steps.parse.outputs.slug }}
          EVIDENCE: ${{ github.event.issue.html_url }}
        run: |
          set -euo pipefail
          python3 tools/maintainer/verify_live.py \
            --slug "$SLUG" \
            --source github \
            --evidence "$EVIDENCE"

      - name: Regenerate catalog
        if: steps.parse.outputs.ok == 'true'
        run: |
          python3 tools/maintainer/build-catalog.py

      - name: Commit and push
        if: steps.parse.outputs.ok == 'true'
        env:
          SLUG: ${{ steps.parse.outputs.slug }}
          ISSUE: ${{ github.event.issue.number }}
          EVIDENCE: ${{ github.event.issue.html_url }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/maintainer/skills.json catalog.json README.md docs/_data/catalog.json docs/skills/ docs/_data/pending.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit (already live-verified?)."
            exit 0
          fi
          git commit -m "badge: $SLUG live-verified via #$ISSUE"
          # Self-heal push loop: the concurrency group serializes the common
          # case, but a peer commit (release_batch push, catalog bot) can land
          # between our checkout and our push. The badge flip is recomputable,
          # so the conflict path is recompute-on-top: reset to the new main,
          # re-run verify_live (idempotent for an already-verified slug),
          # regenerate, re-commit.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt) - recompute on top of new main"
            git fetch --force --tags origin main
            git reset --hard origin/main
            # Tolerate exit 1 here: verify_live exits 1 for an already
            # live-verified slug (e.g. the peer commit that beat us WAS this
            # badge flip), and set -e would kill the loop before the staged-diff
            # check below can conclude there is nothing left to push. The diff
            # check is the real gate.
            python3 tools/maintainer/verify_live.py \
              --slug "$SLUG" \
              --source github \
              --evidence "$EVIDENCE" \
              || echo "verify_live returned non-zero (already verified?) - continuing to diff check"
            python3 tools/maintainer/build-catalog.py
            git add tools/maintainer/skills.json catalog.json README.md docs/_data/catalog.json docs/skills/ docs/_data/pending.json 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "now in sync after peer commit - nothing left to push"
              exit 0
            fi
            git commit -m "badge: $SLUG live-verified via #$ISSUE"
          done
          echo "::error::could not push the badge flip after 5 attempts"
          exit 1

      - name: Thank the reporter
        if: steps.parse.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.parse.outputs.slug }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE" --body "Thank you for closing the loop. **$SLUG** is now badged **live-verified**. See the updated skill page: https://msp-skills.compoundingteams.com/skills/$SLUG/"
