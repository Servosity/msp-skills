name: MCP Registry Publish

# Triggers after the Release workflow completes successfully on a per-skill
# tag.
#
# The Release workflow owns the ENTIRE artifact set now: it assembles the 24
# platform files AND the .mcpb bundle into a DRAFT release, and publishes that
# draft only once the set is proven complete. The repository has immutable
# releases enabled, so a published release can never receive another asset -
# which is why this workflow no longer builds or uploads the bundle. It used to,
# and after the immutability flip that upload would fail with
#   HTTP 422: Cannot upload assets to an immutable release
# exactly as the six build jobs did.
#
# By the time this runs, the release is already public, already sealed, and
# already carries its .mcpb. What is left is the part only this workflow can do:
# compute the bundle's SHA-256, patch the corresponding server.json with the
# hash + version + download URL, and publish to the official MCP Registry
# (registry.modelcontextprotocol.io). One publish fans out to PulseMCP, GitHub
# MCP Registry, Glama, mcp.so, Smithery, and LobeHub within 1–7 days.
#
# Deliberately, this workflow neither uploads nor seals. Sealing must not depend
# on the registry: when mcp-publisher fails, the release is still complete and
# public, and only the registry publish needs retrying.
#
# Skipped automatically if the tag is not a per-skill release tag.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

# Least privilege. This workflow stopped writing to the release when the bundle
# build moved into release.yml, so `contents: write` came off with it; only the
# publish job's OIDC token remains, and only on that job.
permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'refs/tags/') == false }}
    outputs:
      skill: ${{ steps.parse.outputs.skill }}
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
      proceed: ${{ steps.parse.outputs.proceed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # This job only reads the repo to parse a tag. It never pushes, so it
          # gets no git-usable credential left behind in .git/config.
          persist-credentials: false

      - name: Parse triggering tag
        id: parse
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          tag="$HEAD_BRANCH"
          # Generic per-skill derivation: a new skill needs no edit here. The
          # slug is everything before "-v"; the version is everything after it.
          # We only proceed when the tag parses as "<slug>-v<semver>" AND the
          # derived slug exists in tools/maintainer/skills.json.
          skill="${tag%-v*}"      # halopsa-v0.1.0 -> halopsa
          version="${tag##*-v}"   # halopsa-v0.1.0 -> 0.1.0

          proceed=false
          # The tag must actually contain "-v" (so slug/version both parsed) and
          # the semver portion must look like N.N.N.
          if [ "$tag" != "$skill" ] && printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            # argv, never program text - see release.yml and
            # tools/maintainer/is_registered_slug.py.
            if python3 tools/maintainer/is_registered_slug.py --slug "$skill"; then
              # Second condition mirrors release.yml's `any` guard exactly. A
              # registered but markdown-only skill has no vendored cli/, so the
              # Release workflow builds nothing and creates no release for its
              # tag. Skipping on the same input keeps this workflow from hunting
              # for a bundle on a release that was never created.
              releasable=$(python3 tools/maintainer/release_matrix.py --tag "$tag" \
                | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["skill"]))') \
                || releasable=0
              if [ "$releasable" != "0" ]; then
                proceed=true
              else
                echo "Slug '$skill' is registered but has no releasable CLI; skipping MCP publish."
              fi
            fi
          fi

          if [ "$proceed" = "true" ]; then
            {
              echo "tag=$tag"
              echo "skill=$skill"
              echo "version=$version"
              echo "proceed=true"
            } >> "$GITHUB_OUTPUT"
          else
            echo "Tag '$tag' is not a known per-skill release tag (slug must be in skills.json and tag must be <slug>-v<semver>); skipping MCP publish."
            {
              echo "tag=$tag"
              echo "proceed=false"
            } >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: detect
    if: needs.detect.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read   # read the release + download its .mcpb; never writes
      id-token: write  # GitHub OIDC for mcp-publisher auth
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.tag }}
          # Nothing in this job uses git to write: the release upload goes
          # through `gh` with GH_TOKEN, and the registry publish uses OIDC.
          # Leaving a git-usable token in .git/config only gives the third-party
          # publisher binary something worth stealing.
          persist-credentials: false

      # The checkout above is pinned to the TAG being published, so it carries
      # whatever tools/maintainer/ looked like when that tag was cut. workflow_run
      # always runs the DEFAULT BRANCH's copy of this workflow file, so the
      # bundle VALIDATOR it calls must come from the default branch too -
      # otherwise a tag cut before mcpb_bundle.py landed would carry no validator
      # at all (the builder moved to release.yml; the validator stays here so the
      # artifact handed to the registry is re-checked on this side too).
      # skills/<slug>/server.json still comes from the tag, which is correct: the
      # published metadata must match the released version.
      - name: Checkout the default branch's maintainer tools
        uses: actions/checkout@v4
        with:
          path: maintainer-tools
          persist-credentials: false

      - name: Set up jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Download the released .mcpb bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect.outputs.tag }}
          SKILL: ${{ needs.detect.outputs.skill }}
        run: |
          set -euo pipefail
          # The registry records the bundle's download URL and its fileSha256 and
          # never re-checks either. A DRAFT release's asset URLs are not publicly
          # reachable, so publishing from one would burn a permanent 404 into the
          # registry. release.yml seals the release as its very last act, so by
          # the time this runs the release must already be published. If it is
          # not, something went wrong upstream and there is nothing safe to do.
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" != "false" ]; then
            echo "::error::release $TAG is still a DRAFT. Its asset URLs are not publicly"
            echo "::error::reachable, so the registry would record a 404. Refusing to publish."
            echo "::error::Re-run the Release workflow: its publish job seals the release"
            echo "::error::once the full asset set is attached."
            exit 1
          fi
          mkdir -p mcpb-build
          # Built and attached by release.yml's `mcpb` job, in the same workflow
          # run that built the binaries inside it, and the release could not have
          # been sealed without it. Nothing is uploaded from here: the release is
          # immutable by now and would reject it with HTTP 422.
          gh release download "$TAG" --pattern "${SKILL}-mcp.mcpb" --dir mcpb-build || true
          if [ ! -f "mcpb-build/${SKILL}-mcp.mcpb" ]; then
            echo "::error::release $TAG carries no ${SKILL}-mcp.mcpb. A sealed release cannot"
            echo "::error::receive one, so this tag can never be published to the registry."
            echo "::error::Cut the next patch version and let release.yml assemble it."
            exit 1
          fi
          ls -la "mcpb-build/${SKILL}-mcp.mcpb"

      - name: Bundle can actually launch (every declared command resolves)
        env:
          SKILL: ${{ needs.detect.outputs.skill }}
        # release.yml validates the bundle before it attaches it. This re-asserts
        # the same contract against the bytes actually downloaded from the
        # release, on the side that hands them to the registry, so a bundle that
        # cannot start never gets published. Asserts each of mcp_config.command
        # and every platform_overrides.<os>.command names a member the archive
        # contains and that the member is executable. It does NOT assert
        # entry_point == "bin/<mcp binary>" - that would codify the broken bare
        # name and false-RED connectwise-manage, the one manifest that can launch.
        run: |
          set -euo pipefail
          python3 maintainer-tools/tools/maintainer/mcpb_bundle.py validate \
            "mcpb-build/${SKILL}-mcp.mcpb"

      - name: Compute SHA-256
        id: sha
        env:
          SKILL: ${{ needs.detect.outputs.skill }}
        run: |
          set -euo pipefail
          # Hashed from the bytes DOWNLOADED FROM THE RELEASE, not from a local
          # rebuild. The registry's fileSha256 therefore describes the exact
          # artifact its identifier URL serves.
          cd mcpb-build
          hash=$(openssl dgst -sha256 "${SKILL}-mcp.mcpb" | awk '{print $NF}')
          echo "sha=$hash" >> "$GITHUB_OUTPUT"
          echo "Computed SHA-256: $hash"

      - name: Patch server.json with SHA + version + identifier URL
        env:
          SKILL: ${{ needs.detect.outputs.skill }}
          VERSION: ${{ needs.detect.outputs.version }}
          TAG: ${{ needs.detect.outputs.tag }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          src=skills/$SKILL/server.json
          out=mcpb-build/server.json
          # For registryType "mcpb" the registry reads the host from `identifier`,
          # which MUST be the full .mcpb download URL (a bare name -> 400 "Host ''").
          # There is no separate `download` field in the mcpb package schema.
          identifier="https://github.com/${{ github.repository }}/releases/download/${TAG}/${SKILL}-mcp.mcpb"
          jq \
            --arg version "$VERSION" \
            --arg sha "$SHA" \
            --arg identifier "$identifier" \
            '.version = $version | .packages[0].version = $version | .packages[0].fileSha256 = $sha | .packages[0].identifier = $identifier | del(.packages[0].download)' \
            "$src" > "$out"
          echo "--- patched server.json ---"
          cat "$out"

      - name: The URL the registry will record actually resolves
        env:
          SKILL: ${{ needs.detect.outputs.skill }}
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          set -euo pipefail
          # The registry stores `identifier` verbatim and never re-checks it, so
          # a wrong or unreachable URL is permanent for that version. Prove the
          # exact URL resolves ANONYMOUSLY - no token on this curl - before
          # handing it over. This is the check that would have caught a draft, a
          # renamed asset, or a bundle that never attached.
          url="https://github.com/${{ github.repository }}/releases/download/${TAG}/${SKILL}-mcp.mcpb"
          # --range 0-0 asks for one byte, so this proves reachability without
          # pulling the whole bundle. 206 is the range answer; 200 is a server
          # that ignored the range and sent the file. Either proves the URL
          # resolves. Retry a few times: an asset can take a moment to appear on
          # the public CDN right after its release is published.
          code="000"
          for attempt in 1 2 3 4 5; do
            code=$(curl -sSL --range 0-0 -o /dev/null -w '%{http_code}' "$url") || code="000"
            if [ "$code" = "200" ] || [ "$code" = "206" ]; then
              echo "$url resolves anonymously (HTTP $code)."
              exit 0
            fi
            echo "attempt $attempt: $url -> HTTP $code"
            sleep 5
          done
          echo "::error::$url is not publicly reachable (HTTP $code)."
          echo "::error::Refusing to record a URL the registry would serve as a 404."
          exit 1

      - name: Pre-flight - server.json satisfies the registry schema
        env:
          SKILL: ${{ needs.detect.outputs.skill }}
        run: |
          set -euo pipefail
          # This job checks out the TAG being published, but workflow_run always
          # runs the DEFAULT BRANCH's copy of this workflow file. So this step
          # exists for every one of the pre-existing tags while the checker does
          # not. Skip with a notice rather than hard-failing a re-publish of a
          # tag cut before the gate landed; every new tag carries it, and ci.yml
          # gates the same thing at PR time anyway.
          if [ ! -f tools/maintainer/check_mcp_registry.py ]; then
            echo "::notice::tools/maintainer/check_mcp_registry.py is not present at this tag;" \
                 "skipping the registry pre-flight. Tags cut after it landed are checked."
            exit 0
          fi
          python3 tools/maintainer/check_mcp_registry.py --slug "$SKILL"

      - name: Install mcp-publisher (pinned version, digest verified before execution)
        env:
          PUBLISHER_VERSION: "v1.8.1"
          PUBLISHER_ASSET: "mcp-publisher_linux_amd64.tar.gz"
          PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
        run: |
          set -euo pipefail
          # This binary runs inside a job that holds contents:write and
          # id-token:write. Downloading it from the MUTABLE releases/latest URL
          # meant whatever upstream published most recently executed with this
          # repository's credentials. Pin an exact release and verify a
          # repo-committed SHA-256 BEFORE the binary is ever executed. The pin
          # lives in tools/maintainer/mcp_publisher_pin.json so every bump is a
          # reviewable diff.
          #
          # Upstream ships a tarball (mcp-publisher_<os>_<arch>.tar.gz), not a
          # bare binary. The old mcp-publisher-linux-amd64 URL 404'd, failing
          # every registry publish (the .mcpb build + GH release still succeeded).
          # The pin lives in this workflow's env: block, NOT in a repo file. This
          # job checks out the TAG, but workflow_run always runs the DEFAULT
          # BRANCH's copy of this workflow - so a file-based pin is absent for
          # every tag cut before it landed and would hard-fail every re-publish.
          # env: keeps the reviewable-diff property with no tag-compat cost.
          ver="$PUBLISHER_VERSION"
          asset="$PUBLISHER_ASSET"
          want="$PUBLISHER_SHA256"
          if [ -z "$ver" ] || [ -z "$asset" ] || ! printf '%s' "$want" | grep -Eiq '^[0-9a-f]{64}$'; then
            echo "::error::the publisher pin in this workflow's env: block is malformed;"
            echo "::error::PUBLISHER_VERSION/ASSET must be set and SHA256 must be 64 hex chars."
            echo "::error::Refusing to execute an unverifiable publisher."
            exit 1
          fi
          want="$(printf '%s' "$want" | tr 'A-F' 'a-f')"
          url="https://github.com/modelcontextprotocol/registry/releases/download/${ver}/${asset}"
          echo "Pinned publisher: ${ver} ${asset}"
          curl -fsSL "$url" -o mcp-publisher.tar.gz
          got="$(sha256sum mcp-publisher.tar.gz | awk '{print $1}')"
          if [ "$got" != "$want" ]; then
            echo "::error::mcp-publisher digest MISMATCH for ${ver} ${asset}."
            echo "::error::expected ${want}"
            echo "::error::got      ${got}"
            echo "::error::Refusing to execute it. If upstream legitimately re-cut the"
            echo "::error::release, update the PUBLISHER_* env values in this workflow in a"
            echo "::error::reviewed PR after checking upstream's signed checksums file."
            exit 1
          fi
          echo "mcp-publisher digest verified: ${got}"
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --version

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish to official MCP Registry
        run: |
          set -euo pipefail
          cd mcpb-build
          ../mcp-publisher publish --file server.json
          echo "✓ Published to registry.modelcontextprotocol.io"
          echo "Fan-out to PulseMCP, GitHub MCP Registry, Glama, mcp.so, Smithery, LobeHub takes 1–7 days."
