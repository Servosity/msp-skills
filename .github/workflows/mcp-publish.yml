name: MCP Registry Publish

# Triggers after the Release workflow completes successfully on a per-skill
# tag. Bundles each skill's MCP binary into an .mcpb (zip), attaches it to the
# release, computes its SHA-256, patches the corresponding server.json with the
# hash + version + download URL, and publishes to the official MCP Registry
# (registry.modelcontextprotocol.io). One publish fans out to PulseMCP, GitHub
# MCP Registry, Glama, mcp.so, Smithery, and LobeHub within 1–7 days.
#
# Skipped automatically if the tag is not a per-skill release tag.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: write   # upload .mcpb to the release
  id-token: write   # GitHub OIDC for mcp-publisher auth

jobs:
  detect:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'refs/tags/') == false }}
    outputs:
      skill: ${{ steps.parse.outputs.skill }}
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
      proceed: ${{ steps.parse.outputs.proceed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse triggering tag
        id: parse
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          tag="$HEAD_BRANCH"
          # Generic per-skill derivation: a new skill needs no edit here. The
          # slug is everything before "-v"; the version is everything after it.
          # We only proceed when the tag parses as "<slug>-v<semver>" AND the
          # derived slug exists in tools/maintainer/skills.json.
          skill="${tag%-v*}"      # halopsa-v0.1.0 -> halopsa
          version="${tag##*-v}"   # halopsa-v0.1.0 -> 0.1.0

          proceed=false
          # The tag must actually contain "-v" (so slug/version both parsed) and
          # the semver portion must look like N.N.N.
          if [ "$tag" != "$skill" ] && printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            # argv, never program text - see release.yml and
            # tools/maintainer/is_registered_slug.py.
            if python3 tools/maintainer/is_registered_slug.py --slug "$skill"; then
              proceed=true
            fi
          fi

          if [ "$proceed" = "true" ]; then
            {
              echo "tag=$tag"
              echo "skill=$skill"
              echo "version=$version"
              echo "proceed=true"
            } >> "$GITHUB_OUTPUT"
          else
            echo "Tag '$tag' is not a known per-skill release tag (slug must be in skills.json and tag must be <slug>-v<semver>); skipping MCP publish."
            {
              echo "tag=$tag"
              echo "proceed=false"
            } >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: detect
    if: needs.detect.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.tag }}

      - name: Set up jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Download MCP binaries from release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect.outputs.tag }}
          SKILL: ${{ needs.detect.outputs.skill }}
        run: |
          set -euo pipefail
          mkdir -p mcpb-build
          cd mcpb-build
          # The release.yml workflow uploads platform-suffixed binaries like
          # halopsa-mcp-darwin-arm64, halopsa-mcp-linux-amd64, etc. We bundle
          # ALL platforms into one .mcpb so the registry-published artifact
          # works on every platform Claude Desktop runs on.
          for suffix in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64 windows-amd64.exe; do
            gh release download "$TAG" --pattern "${SKILL}-mcp-${suffix}" --dir . || true
          done
          ls -la

      - name: Build MCPB bundle
        env:
          SKILL: ${{ needs.detect.outputs.skill }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          cd mcpb-build
          # MCPB is a zip with manifest.json + a bin/ directory of the binaries.
          mkdir -p bundle/bin
          cp ../skills/$SKILL/manifest.json bundle/manifest.json
          for f in ${SKILL}-mcp-*; do
            [ -f "$f" ] || continue
            cp "$f" "bundle/bin/$f"
          done
          (cd bundle && zip -r "../${SKILL}-mcp.mcpb" .)
          ls -la "${SKILL}-mcp.mcpb"

      - name: Compute SHA-256
        id: sha
        env:
          SKILL: ${{ needs.detect.outputs.skill }}
        run: |
          set -euo pipefail
          cd mcpb-build
          hash=$(openssl dgst -sha256 "${SKILL}-mcp.mcpb" | awk '{print $NF}')
          echo "sha=$hash" >> "$GITHUB_OUTPUT"
          echo "Computed SHA-256: $hash"

      - name: Upload MCPB to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect.outputs.tag }}
          SKILL: ${{ needs.detect.outputs.skill }}
        run: |
          set -euo pipefail
          cd mcpb-build
          gh release upload "$TAG" "${SKILL}-mcp.mcpb" --clobber

      - name: Patch server.json with SHA + version + identifier URL
        env:
          SKILL: ${{ needs.detect.outputs.skill }}
          VERSION: ${{ needs.detect.outputs.version }}
          TAG: ${{ needs.detect.outputs.tag }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          src=skills/$SKILL/server.json
          out=mcpb-build/server.json
          # For registryType "mcpb" the registry reads the host from `identifier`,
          # which MUST be the full .mcpb download URL (a bare name -> 400 "Host ''").
          # There is no separate `download` field in the mcpb package schema.
          identifier="https://github.com/${{ github.repository }}/releases/download/${TAG}/${SKILL}-mcp.mcpb"
          jq \
            --arg version "$VERSION" \
            --arg sha "$SHA" \
            --arg identifier "$identifier" \
            '.version = $version | .packages[0].version = $version | .packages[0].fileSha256 = $sha | .packages[0].identifier = $identifier | del(.packages[0].download)' \
            "$src" > "$out"
          echo "--- patched server.json ---"
          cat "$out"

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          # Upstream ships a tarball (mcp-publisher_<os>_<arch>.tar.gz), not a bare
          # binary. The old mcp-publisher-linux-amd64 URL 404'd, failing every
          # registry publish (the .mcpb build + GH release still succeeded).
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz -o mcp-publisher.tar.gz
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --version

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish to official MCP Registry
        run: |
          set -euo pipefail
          cd mcpb-build
          ../mcp-publisher publish --file server.json
          echo "✓ Published to registry.modelcontextprotocol.io"
          echo "Fan-out to PulseMCP, GitHub MCP Registry, Glama, mcp.so, Smithery, LobeHub takes 1–7 days."
