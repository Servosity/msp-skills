name: Release

on:
  push:
    tags:
      # Generic per-skill release tag. A new skill needs no edit here: any tag
      # shaped "<slug>-v<major>.<minor>.<patch>" fires this workflow. The build
      # job derives the slug from the tag and skips gracefully if the slug is
      # not in tools/maintainer/skills.json.
      - "*-v*.*.*"

# Least privilege at the top: read is the floor, and only the three jobs that
# actually mutate the GitHub Release ask for `contents: write` in their own
# `permissions:` block. Before this every job held a release-write credential,
# including the one that downloads and executes four third-party scanners.
permissions:
  contents: read

env:
  GH_REPO: ${{ github.repository }}

jobs:
  # The build matrix is COMPUTED from the repo (tools/maintainer/skills.json + introspection
  # of each skills/<slug>/cli/). Adding a skill needs no edit here. The matrix
  # is scoped to THE SKILL THE TAG NAMES (one tag = one skill x 6 targets) -
  # unscoped, every tag would spawn a no-op matrix job per skill x platform,
  # which at fleet scale is hundreds of wasted checkouts per release. An
  # unknown slug yields an empty matrix and the build job skips entirely; the
  # per-row tag_skill guard below stays as second-layer defense.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      any: ${{ steps.gen.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Reads the repo to compute a matrix; never pushes. No git-usable
          # credential is left in .git/config for anything this job runs.
          persist-credentials: false
      - name: Compute build matrix
        id: gen
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          matrix="$(python3 tools/maintainer/release_matrix.py --tag "$TAG")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "any=$(printf '%s' "$matrix" | python3 -c 'import json,sys; print(str(len(json.load(sys.stdin)["skill"])>0).lower())')" >> "$GITHUB_OUTPUT"

  # Release-time security gate (Layer 3): re-verify the tagged connector before any
  # build/publish. Belt-and-suspenders with the PR `security-gate` check - a tag could
  # be pushed on a commit that never went through a gated PR. Add a tag-protection rule
  # for `*-v*` so a release can't bypass this.
  security_gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # This job downloads and executes third-party scanners. It never
          # pushes, so it must not leave a git-usable repository credential in
          # .git/config where a compromised scanner could read it.
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install scanners (best-effort install; the gate fails CLOSED if a required one is missing)
        env:
          # PINNED, not @latest. These four tools are fetched and then EXECUTED
          # inside a job that carries contents:write, so a compromised (or merely
          # re-cut) upstream release would run with this repository's release
          # credential. @latest also makes the gate's verdict non-reproducible:
          # the same tag re-run a week later scans with different rules.
          # Each pin below is the version @latest resolved to on 2026-08-26, so
          # this change pins current behavior rather than altering it.
          # To bump: change the version here, re-run the gate, land as a reviewed PR.
          GOSEC_VERSION: "v2.29.0"
          GOVULNCHECK_VERSION: "v1.7.0"
          # osv-scanner v2 lives at a different module path
          # (github.com/google/osv-scanner/v2); v1.9.2 is the newest on this v1
          # path and is what @latest resolved to here.
          OSV_SCANNER_VERSION: "v1.9.2"
          SEMGREP_VERSION: "1.174.0"
        run: |
          set -uo pipefail
          go install "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}" || true
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" || true
          # osv-scanner is a REQUIRED scanner for the gate; it was previously absent at
          # release time, so the release never ran osv at all. Install it for parity.
          go install "github.com/google/osv-scanner/cmd/osv-scanner@${OSV_SCANNER_VERSION}" || true
          python3 -m pip install --quiet "semgrep==${SEMGREP_VERSION}" || true
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Pre-warm scanner caches for the tagged connector
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          # gosec + govulncheck load the connector through golang.org/x/tools/go/packages.
          # On a cold release runner the load - download + typecheck of a large dependency
          # tree (e.g. connectwise-control: enetx/http + enetx/surf; axcient: surf + quic-go
          # + utls + modernc/sqlite -> modernc/libc) - can exceed a scanner's timeout and
          # fail-close as scanner-error (exit 124), which is NOT a real finding. `go vet ./...`
          # drives the SAME go/packages loader, so it warms the module + export-data caches
          # the scanners reuse. (A plain `go build` warms only the compile cache, not the
          # go/packages export data - which is the actual cold cost, why an earlier
          # build-based pre-warm did not help.) vet runs no connector code, so it cannot
          # weaken the gate. Mirrors security-gate.yml for the release path.
          slug="${TAG%-v*}"
          if [ -f "skills/$slug/cli/go.mod" ]; then
            echo "::group::pre-warm $slug"
            (cd "skills/$slug/cli" && go vet ./...) >/dev/null 2>&1 || echo "pre-warm vet for $slug reported issues (non-fatal)"
            echo "::endgroup::"
          fi
      - name: Gate the tagged connector (P1 blocks the release)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          slug="${TAG%-v*}"
          if [ ! -d "skills/$slug/cli" ]; then
            echo "No connector for tag $TAG (slug=$slug) - nothing to gate."; exit 0
          fi
          # --require-scanners: fail CLOSED if a required scanner is missing/errors, so a
          # broken install cannot let a release bypass the supply-chain gate.
          python3 tools/maintainer/check_security_gate.py --slug "$slug" --require-scanners

  # Create the GitHub Release as a DRAFT, once, before the matrix build jobs
  # upload to it. The `publish` job at the bottom is what seals it, and only
  # after the artifact set is proven complete.
  create-release:
    needs: [prepare, security_gate]
    # A tag whose slug is not a releasable skill yields an empty build matrix.
    # Creating a release for it would leave litter that nothing can finish: a
    # permanently empty PUBLISHED release under immutable releases, or a
    # permanent draft. So create nothing at all; every job below skips with it.
    if: needs.prepare.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      # 'true' when a release for this tag already exists AND is already
      # published, i.e. already immutable. Nothing can be uploaded to it and
      # nothing is left to seal, so build/mcpb/publish all skip.
      sealed: ${{ steps.ensure.outputs.sealed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The release is created through `gh` with GH_TOKEN; git itself is
          # only read from here.
          persist-credentials: false

      - name: Ensure a draft release exists
        id: ensure
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # `gh release view` resolves draft releases by tag name too, so this
            # finds a half-assembled draft from an earlier run as well as a
            # finished published release.
            if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = "true" ]; then
              echo "Draft release $TAG already exists; reusing it."
              echo "sealed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Already published, therefore already immutable. Re-running the
            # matrix against it can only produce six identical 422s, so stop
            # here and say something useful instead. If the asset set is
            # complete this is a harmless no-op re-run; if it is NOT complete,
            # the release is unrepairable by definition and the operator needs
            # to know that rather than watch jobs fail one at a time.
            echo "sealed=true" >> "$GITHUB_OUTPUT"
            if gh release view "$TAG" --json assets -q '.assets[].name' \
              | python3 tools/maintainer/check_release_assets.py --tag "$TAG" --with-mcpb; then
              echo "::notice::$TAG is already published and complete; nothing to do."
              exit 0
            fi
            echo "::error::$TAG is already PUBLISHED and therefore immutable, but its"
            echo "::error::asset set is incomplete (missing names listed above). Assets can"
            echo "::error::never be added to a sealed release, so re-running this workflow"
            echo "::error::cannot fix it. Delete the release and the tag and re-tag, or cut"
            echo "::error::the next patch version."
            exit 1
          fi
          # Release notes come from the SKILL'S OWN CHANGELOG, never
          # --generate-notes.
          #
          # --generate-notes computes its range against the previous tag in the
          # REPO. In a monorepo with per-skill tags that is some unrelated
          # skill's tag, so the notes list every PR merged in between regardless
          # of what it touched. zammad-v0.1.1 shipped notes advertising the
          # auvik onboarding and a batch of CI work, footed with
          # "compare/unifi-network-v0.1.0...zammad-v0.1.1" - accurate about the
          # range, useless and misleading about the skill.
          #
          # The per-skill CHANGELOG section is the authoritative, human-written
          # answer to "what changed in THIS connector", and release.py already
          # maintains it.
          slug="${TAG%-v*}"
          version="${TAG##*-v}"
          notes=$(python3 tools/maintainer/changelog_section.py --slug "$slug" --version "$version") || {
            echo "::error::no usable CHANGELOG section for $slug $version"
            exit 1
          }
          printf '%s\n' "$notes" > /tmp/release-notes.md
          # --draft is load-bearing now that the repository has immutable
          # releases enabled. A PUBLISHED release is sealed the moment it is
          # created, so the build job's asset upload comes back
          #   HTTP 422: Cannot upload assets to an immutable release
          # and the release stays permanently empty - unfixable by definition.
          # A draft is not immutable, so assets land normally; the publish job
          # below flips it to published only after every target succeeded, and
          # THAT is the moment it becomes immutable, with its assets already in
          # place. This is the draft-assemble -> verify -> publish ordering.
          gh release create "$TAG" --draft --title "$TAG" --notes-file /tmp/release-notes.md
          echo "sealed=false" >> "$GITHUB_OUTPUT"

  build:
    needs: [prepare, create-release, security_gate]
    if: needs.prepare.outputs.any == 'true' && needs.create-release.outputs.sealed == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Assets are uploaded through `gh` with GH_TOKEN; this job never
          # pushes with git.
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.skill.dir }}/go.mod

      - name: Build and upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: "0"
          # SINGLE SOURCE OF TRUTH for asset filenames. These are the FINAL
          # literal names, computed by registry.asset_map() and embedded in the
          # matrix by tools/maintainer/release_matrix.py - the same function
          # tools/maintainer/check_release_contract.py checks the install scripts
          # against. This workflow no longer rebuilds the "-<goos>-<goarch>"
          # suffix or the windows ".exe" rule in shell, so it cannot drift away
          # from the gate that is supposed to police it (before this, the
          # contract check could pass green while the workflow uploaded
          # something else entirely).
          CLI_ASSET: ${{ matrix.skill.assets[format('{0}-{1}', matrix.target.goos, matrix.target.goarch)].cli }}
          MCP_ASSET: ${{ matrix.skill.assets[format('{0}-{1}', matrix.target.goos, matrix.target.goarch)].mcp }}
        run: |
          set -euo pipefail
          skill="${{ matrix.skill.name }}"
          # Each skill is tagged and released independently
          # (<slug>-v<semver>); a tag builds only its matching skill. The slug
          # is derived generically from the tag, so a new skill needs no edit
          # here. Asset names come from the matrix (see CLI_ASSET/MCP_ASSET
          # above) and are proven equal to what skills/<skill>/install.sh and
          # install.ps1 download by tools/maintainer/check_release_contract.py.
          tag_skill="${TAG%-v*}"      # halopsa-v0.1.0 -> halopsa
          version="${TAG##*-v}"       # halopsa-v0.1.0 -> 0.1.0

          # Guard: the derived slug must exist in skills.json, else skip. This
          # keeps an arbitrary "*-v*.*.*" tag from trying to build a nonexistent
          # skill. The whole release run no-ops cleanly for an unknown slug.
          # argv, never program text: $tag_skill comes from the pushed tag, so
          # interpolating it into a `python3 -c` string let a tag execute code.
          if ! python3 tools/maintainer/is_registered_slug.py --slug "$tag_skill"; then
            echo "Tag $TAG: derived slug '$tag_skill' is not in skills.json; skipping."
            exit 0
          fi

          # This matrix row builds only the skill the tag names.
          [ "$skill" = "$tag_skill" ] || { echo "Tag $TAG: skipping $skill (this tag releases $tag_skill)."; exit 0; }

          # Asset names come from the matrix (registry.asset_map), never from
          # string-building here. Fail loudly rather than uploading an empty or
          # half-formed name if the matrix ever lacks this target's entry.
          cli="$CLI_ASSET"
          mcp="$MCP_ASSET"
          if [ -z "$cli" ] || [ -z "$mcp" ]; then
            echo "::error::matrix carries no asset names for ${GOOS}-${GOARCH};"
            echo "::error::regenerate with tools/maintainer/release_matrix.py"
            exit 1
          fi

          # $version (derived above as ${TAG##*-v}) is stamped into the CLI,
          # matching the prior goreleaser config.
          mkdir -p "$GITHUB_WORKSPACE/dist"
          (
            cd "${{ matrix.skill.dir }}"
            go build -trimpath -ldflags "-s -w -X ${{ matrix.skill.module }}/internal/cli.version=${version}" -o "$GITHUB_WORKSPACE/dist/${cli}" "${{ matrix.skill.cli_cmd }}"
            go build -trimpath -ldflags "-s -w" -o "$GITHUB_WORKSPACE/dist/${mcp}" "${{ matrix.skill.mcp_cmd }}"
          )

          cd "$GITHUB_WORKSPACE/dist"
          for f in "$cli" "$mcp"; do
            shasum -a 256 "$f" > "${f}.sha256"
          done

          # The release is still a DRAFT here, which is the only reason this
          # upload can succeed at all: the repository has immutable releases
          # enabled, and a PUBLISHED release rejects every asset upload with
          # "HTTP 422: Cannot upload assets to an immutable release".
          # --clobber makes re-runs idempotent. Each matrix job uploads only its
          # own four files, so concurrent jobs never collide on the same asset.
          gh release upload "$TAG" "$cli" "$mcp" "${cli}.sha256" "${mcp}.sha256" --clobber

  # Build the cross-platform MCPB bundle and attach it to the DRAFT.
  #
  # This used to live in mcp-publish.yml, which runs on `workflow_run` AFTER
  # this workflow finishes. That ordering cannot survive immutable releases: by
  # the time mcp-publish ran the release would already be sealed, and its
  # `gh release upload --clobber` would fail with the same 422 the six build
  # jobs hit on the first immutable release. Moving the bundle here puts the
  # WHOLE artifact set - 24 platform files plus the bundle - inside the one
  # workflow that assembles the draft and seals it once, at the end.
  # mcp-publish.yml keeps the part only it can do: patch server.json with the
  # bundle hash and publish to the MCP Registry, pointing at a release that is
  # public by then.
  mcpb:
    needs: [prepare, create-release, build]
    if: needs.prepare.outputs.any == 'true' && needs.create-release.outputs.sealed == 'false'
    runs-on: ubuntu-latest
    permissions:
      # Draft releases are visible only to accounts with push access, so this
      # job needs write to READ from the draft as well as to upload to it.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The bundle is attached through `gh` with GH_TOKEN; git never pushes.
          persist-credentials: false

      - name: Download this tag's MCP binaries from the draft
        run: |
          set -euo pipefail
          slug="${TAG%-v*}"
          # argv, never program text - same rule as the build job, see
          # tools/maintainer/is_registered_slug.py.
          if ! python3 tools/maintainer/is_registered_slug.py --slug "$slug"; then
            echo "::error::derived slug '$slug' is not in skills.json"
            exit 1
          fi
          mkdir -p mcpb-build
          # The build job above uploaded platform-suffixed binaries
          # (<slug>-mcp-darwin-arm64 and friends). Bundle ALL platforms into one
          # .mcpb so the registry-published artifact works everywhere Claude
          # Desktop runs. windows/arm64 is deliberately absent from this loop:
          # MCPB has no host for it, which is why the expected count below is 5
          # and not 6.
          for suffix in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64 windows-amd64.exe; do
            gh release download "$TAG" --pattern "${slug}-mcp-${suffix}" --dir mcpb-build || true
          done
          ls -la mcpb-build

      - name: Build MCPB bundle
        env:
          # The build job publishes six targets; the download loop asks for five
          # (windows/arm64 has no MCPB host). Keep these in step.
          EXPECTED_BINARIES: "5"
        run: |
          set -euo pipefail
          slug="${TAG%-v*}"
          version="${TAG##*-v}"
          copied=$(find mcpb-build -maxdepth 1 -type f -name "${slug}-mcp-*" | wc -l | tr -d ' ')
          # The download step tolerates a per-asset failure with `|| true`, and the
          # upload uses --clobber. Together those mean a transient GitHub outage
          # could produce a manifest-only bundle and OVERWRITE a working released
          # .mcpb with it. Refuse to build a bundle that is missing binaries: a
          # failed run leaves the draft unsealed and the previous release's asset
          # untouched, which is the safe direction.
          echo "downloaded $copied binary/binaries"
          if [ "$copied" -lt "$EXPECTED_BINARIES" ]; then
            echo "::error::only $copied of $EXPECTED_BINARIES platform binaries were downloaded for $slug;" \
                 "refusing to build a partial bundle that --clobber would publish over the working asset"
            exit 1
          fi
          # MCPB is a zip with manifest.json + a bin/ directory of binaries. Hand
          # rolling that with `zip -r` is what shipped 64 bundles the host cannot
          # start: the manifest named bin/<slug>-mcp while the archive held only
          # arch-suffixed binaries, and `gh release download` + `zip -r` left every
          # one of them mode 0644. The builder merges the two darwin slices into a
          # universal Mach-O, writes per-OS platform_overrides that resolve, sets
          # the executable bit, and refuses to emit a bundle that does not validate.
          # See issue #287 and tools/maintainer/mcpb_bundle.py.
          #
          # Running inside release.yml, the builder comes from the TAG's checkout
          # rather than the default branch. That is correct here and was not in
          # mcp-publish.yml: a tag push runs the workflow file AND the tools from
          # the same commit, so the two cannot disagree about the bundle format.
          #
          # --binary-prefix is "<slug>-mcp" - exactly the names the download loop
          # asked for and the build job uploaded. It is deliberately NOT derived
          # from manifest.json's `name`, which still reads "<slug>-pp-mcp" on
          # eight connectors and would name members that do not exist.
          python3 tools/maintainer/mcpb_bundle.py build \
            --manifest "skills/$slug/manifest.json" \
            --bin-dir mcpb-build \
            --binary-prefix "${slug}-mcp" \
            --out "mcpb-build/${slug}-mcp.mcpb" \
            --version "$version"
          ls -la "mcpb-build/${slug}-mcp.mcpb"

      - name: Bundle can actually launch (every declared command resolves)
        # Separate from the build step on purpose: the builder validates its own
        # output, and this re-asserts it against the file on disk, before the
        # upload, so a bundle that cannot start never reaches a release or the
        # registry. Asserts each of mcp_config.command and every
        # platform_overrides.<os>.command names a member the archive contains and
        # that the member is executable. It does NOT assert
        # entry_point == "bin/<mcp binary>" - that would codify the broken bare
        # name and false-RED connectwise-manage, the one manifest that can launch.
        #
        # Now that the bundle is part of the sealing contract, a bundle that
        # cannot launch blocks the whole release rather than only the registry
        # publish.
        run: |
          set -euo pipefail
          slug="${TAG%-v*}"
          python3 tools/maintainer/mcpb_bundle.py validate "mcpb-build/${slug}-mcp.mcpb"

      - name: Attach the bundle to the draft
        run: |
          set -euo pipefail
          slug="${TAG%-v*}"
          # Still a draft, so this upload is legal; --clobber keeps a re-run of a
          # partially-failed release idempotent.
          gh release upload "$TAG" "mcpb-build/${slug}-mcp.mcpb" --clobber

  # THE SEAL. Publishing is what makes a release immutable, so it is the last
  # thing this workflow does and it happens only after the asset set is proven
  # complete against the shared source of truth.
  #
  # `needs` is the safety property: if ANY of the six build targets failed, or
  # the bundle failed to build or validate, this job never runs and the release
  # stays a DRAFT - invisible to installers, invisible to the install one-liners,
  # and still fixable by re-running the workflow. The failure mode this replaces
  # was a published, permanently empty release.
  publish:
    needs: [prepare, create-release, build, mcpb]
    if: needs.prepare.outputs.any == 'true' && needs.create-release.outputs.sealed == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Assert the asset set is complete, then seal the release
        run: |
          set -euo pipefail
          state=$(gh release view "$TAG" --json isDraft -q .isDraft)
          # The expected names come from the SAME shared source the build matrix
          # was driven from (release_matrix.skill_entries -> registry.asset_map),
          # so this check cannot drift from what was actually uploaded. Nothing
          # here re-derives the "-<goos>-<goarch>" suffix or the windows ".exe"
          # rule in shell.
          gh release view "$TAG" --json assets -q '.assets[].name' \
            | python3 tools/maintainer/check_release_assets.py --tag "$TAG" --with-mcpb
          if [ "$state" != "true" ]; then
            # Already published - a concurrent or repeated run got here first.
            # It is complete (checked above), so converge instead of editing an
            # immutable release, which would 422.
            echo "::notice::$TAG is already published and complete; nothing to seal."
            exit 0
          fi
          gh release edit "$TAG" --draft=false

      - name: Confirm the release is public
        run: |
          set -euo pipefail
          state=$(gh release view "$TAG" --json isDraft -q .isDraft)
          if [ "$state" != "false" ]; then
            echo "::error::$TAG is still a draft after the publish step; the seal did not take."
            exit 1
          fi
          echo "$TAG is published and immutable with its complete asset set."
