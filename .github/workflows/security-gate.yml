name: security-gate

# Deterministic, release-blocking security gate (Layer 3). Anyone can open a PR, so a
# connector diff may carry a poisoned fix that would ship to downstream MSPs. This gate
# runs deterministic supply-chain + dangerous-pattern checks and FAILS the PR on any P1.
#
# Runs on EVERY PR (no paths filter) so it always reports a conclusion and is safe to
# make a REQUIRED status check in branch protection on `main`. On PRs that touch no
# connector/installer files it short-circuits to success without the scanner install.
# Pair it with a `*-v*` tag-protection rule so a release tag cannot bypass it.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scope - what did this PR change?
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          changed="$(git diff --name-only "${BASE_SHA}...HEAD")"
          # Gate-LOGIC changes cannot be self-approved (the workflow runs the PR's own
          # copy of the script). Hard-fail so a security maintainer (CODEOWNERS) reviews
          # them. DATA files (dep_allowlist.json, security_suppressions.json) are NOT
          # hard-failed: the gate reads them from the trusted base (--policy-base), so an
          # in-PR edit cannot take effect, and CODEOWNERS still gates them.
          if printf '%s\n' "$changed" | grep -qE '^(tools/maintainer/check_security_gate\.py|\.semgrep\.yml|\.github/workflows/security-gate\.yml|\.github/workflows/release\.yml|\.github/CODEOWNERS)$'; then
            echo "::error::This PR modifies the security-gate LOGIC. That cannot be self-"
            echo "::error::approved - a security maintainer (CODEOWNERS) must review it;"
            echo "::error::the gate fails by design until then. Split unrelated changes out."
            exit 1
          fi
          # Connectors / installers touched? Restrict to the valid slug charset so a
          # hostile path cannot smuggle anything downstream.
          slugs="$(printf '%s\n' "$changed" | sed -nE 's#^skills/([a-z0-9][a-z0-9-]*)/.*#\1#p' | sort -u)"
          if [ -n "$slugs" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            { echo "slugs<<SLUGS_EOF"; printf '%s\n' "$slugs"; echo "SLUGS_EOF"; } >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No connector/installer changes - security gate trivially passes."
          fi

      - name: Setup Go
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install scanners (gosec, govulncheck, osv-scanner, semgrep)
        if: steps.scope.outputs.relevant == 'true'
        run: |
          set -uo pipefail
          go install github.com/securego/gosec/v2/cmd/gosec@latest || echo "gosec install failed (non-fatal)"
          go install golang.org/x/vuln/cmd/govulncheck@latest || echo "govulncheck install failed (non-fatal)"
          go install github.com/google/osv-scanner/cmd/osv-scanner@latest || echo "osv-scanner install failed (non-fatal)"
          python3 -m pip install --quiet semgrep || echo "semgrep install failed (non-fatal)"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run the deterministic security gate (diff-scoped, base-trusted policy)
        if: steps.scope.outputs.relevant == 'true'
        env:
          # Pass slugs via env (NOT ${{ }} inlined into the script) so a hostile dir
          # name can never be interpreted as a command. check_security_gate also
          # re-validates each slug.
          SLUGS: ${{ steps.scope.outputs.slugs }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          rc=0
          for s in $SLUGS; do
            echo "::group::security-gate $s"
            # --require-scanners: a missing/erroring required scanner (gosec/govulncheck/
            # osv-scanner) is a P1, not a silent skip - a broken install cannot disable
            # the gate. govulncheck (reachability) + osv (presence, demoted) honor it.
            python3 tools/maintainer/check_security_gate.py \
              --slug "$s" --base "$BASE_SHA" --policy-base "$BASE_SHA" --require-scanners || rc=1
            echo "::endgroup::"
          done
          if [ "$rc" -ne 0 ]; then
            echo "::error::security-gate found P1 finding(s) - see logs. A poisoned/insecure"
            echo "::error::change must not merge. Fix the finding, or add a vetted entry to"
            echo "::error::tools/maintainer/security_suppressions.json in a separate, reviewed PR."
          fi
          exit "$rc"
