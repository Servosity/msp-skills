title: "MSP Skills"
description: "Free Claude Code skills + MCP servers for HaloPSA tickets and Servosity backups. Works with Claude, ChatGPT, Codex, Cursor. For MSP owners."
url: "https://msp-skills.compoundingteams.com"
baseurl: ""
github_repo: "servosity/msp-skills"
github_url: "https://github.com/servosity/msp-skills"

# Where the "be the first to verify" receipt form lives (PR-3 builds /verified/).
receipt_form_url: "/verified/#receipt"

# jekyll-seo-tag emits a <meta name="google-site-verification"> from this key.
# TODO: real Search Console token - swap the placeholder once the property is
# verified in Google Search Console (Settings > Ownership verification > HTML tag).
webmaster_verifications:
  google: "GOOGLE_SEARCH_CONSOLE_TOKEN_PLACEHOLDER"

# AEO surface
author:
  name: "Servosity"
  url: "https://www.servosity.com"
organization:
  name: "Servosity Inc."
  url: "https://www.servosity.com"
  same_as:
    - "https://github.com/servosity"
    - "https://compoundingteams.com"

# Jekyll
permalink: pretty
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# Don't render these as Jekyll pages (they're repo docs surfaced via GitHub)
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Default front matter for new pages (saves repetition)
defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/social/og-1280x640.png
