title: "MSP Skills"
description: "Free, open source MCP servers and Claude Code Skills that connect your MSP tools (PSA, RMM, backup, security, billing, Microsoft 365) to Claude, ChatGPT, Copilot and other AI agents. Built for MSP owners."
url: "https://msp-skills.compoundingteams.com"
baseurl: ""
github_repo: "servosity/msp-skills"
github_url: "https://github.com/servosity/msp-skills"

# Where the "be the first to verify" receipt form lives (PR-3 builds /verified/).
receipt_form_url: "/verified/#receipt"

# Google Search Console: no token yet. jekyll-seo-tag emits
# <meta name="google-site-verification"> from webmaster_verifications.google,
# and a placeholder value published a fake tag, so the key is left out. Once the
# property is verified (Settings > Ownership verification > HTML tag), add:
#   webmaster_verifications:
#     google: "<the real token>"

# AEO surface
author:
  name: "Servosity"
  url: "https://www.servosity.com"
organization:
  name: "Servosity Inc."
  url: "https://www.servosity.com"
  same_as:
    - "https://github.com/servosity"
    - "https://compoundingteams.com"

# Jekyll
permalink: pretty
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# /.well-known/ (agent-skills/index.json, ai-catalog.json): Jekyll skips dot
# folders unless they are listed here.
include:
  - .well-known

# Clean Markdown copies of the pages, served byte for byte next to them
# (/skills/acronis/ -> /skills/acronis.md). Generated by
# tools/maintainer/build-llms.py into docs/_markdown_copies; never edit by hand.
collections:
  markdown_copies:
    output: true
    permalink: /:path

# GitHub Pages renders a .md file without front matter as a page AND copies
# the raw file. Keep only the page, so /install-skill.md is the generated copy.
optional_front_matter:
  remove_originals: true

# Don't render these as Jekyll pages (they're repo docs surfaced via GitHub)
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Default front matter for new pages (saves repetition)
defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/social/og-1280x640.png
